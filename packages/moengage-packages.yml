notes: >-
  MoEngage ships first-party client SDKs for every mobile and web platform it supports. There is no
  first-party server-side REST API client library in any registry — the REST APIs are consumed directly
  over HTTP with Basic Auth. Third-party wrappers exist on npm and PyPI and are flagged official: false.
currency_note: >-
  Every entry carries a structured `version:` and `published:` (ISO date) read from the registry
  metadata endpoint on 2026-08-14. Two decay findings this round. (1) The Maven versions recorded in the
  2026-08-01 pass were badly stale — search.maven.org's `latestVersion` field returned January 2025
  values while repo1.maven.org/maven2/com/moengage/*/maven-metadata.xml (authoritative) shows every
  Android artifact republished in August 2026; the numbers below come from maven-metadata.xml. (2) The
  CocoaPods umbrella pods MoEngageSDK (9.20.1) and MoEngageCore (9.24.0) have not been republished since
  April 2025, while the same iOS SDK is at 11.00.0 (2026-07-22) on Swift Package Manager via
  github.com/moengage/apple-sdk — the CocoaPods distribution trails the SPM distribution by two major
  versions. The feature pods (InApps, Cards, Inbox, Geofence, RichNotification) were all republished
  2026-07-22 and are current.
