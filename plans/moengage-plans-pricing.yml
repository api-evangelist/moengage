billing_unit_definition: >-
  Monthly Tracked Users — each unique end-user profile that performs at least one session or defined
  event within a calendar month. A user counts once per month regardless of activity frequency.
  Campaign interactions, notifications sent, uninstalls, and attribute updates generated by MoEngage
  itself do not count toward the MTU total. Data uploads and customer attribute updates are not charged
  separately. (Definition published on the AWS Marketplace listing.)
