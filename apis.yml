  description: >-
    Hosted, OAuth-secured Model Context Protocol server that lets AI assistants build campaign drafts,
    author content, create and count segments, read and analyze flows, browse dashboards, search campaigns,
    and run campaign and product-behavior analytics against a MoEngage workspace. Available in DC01 through
    DC04. A separate documentation MCP server serves the docs site.
  humanURL: >-
    https://www.moengage.com/docs/user-guide/ai-and-intelligence/merlin-ai/moengage-mcp-server
