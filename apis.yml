aid: moengage
name: MoEngage
description: >-
  MoEngage is an insights-led customer engagement and cross-channel marketing automation platform used by
  consumer brands to unify customer data, segment audiences, and orchestrate personalized messaging across
  push notifications, email, SMS, WhatsApp, in-app messages, on-site messaging, app inbox cards, and web
  push. The platform exposes a broad REST API surface across seven regional data centers (DC-01 through
  DC-06 and DC-101) covering user and event ingestion, bulk import, business events, GDPR/CCPA data
  requests, campaign creation and lifecycle management, file- and filter-based segments, cohort sync,
  content blocks and channel templates, product catalogs, recommendations, coupon lists, offer decisioning,
  subscription and opt-in preferences, transactional alerts (Inform), iOS Live Activities, personalization
  experiences, campaign statistics, message archival, and custom analytics dashboards. MoEngage also ships
  native mobile and web SDKs for Android, iOS, Web, React Native, Flutter, Unity, Cordova and Capacitor,
  and operates a hosted, OAuth-secured Model Context Protocol (MCP) server so AI assistants can draft
  campaigns, manage segments and flows, and analyze performance conversationally.
