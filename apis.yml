  name: MoEngage File Segments API
  description: >-
    If you need to create segments by importing a large number of users, we recommend utilising the File
    segment API. This API allows you to easily generate a file segment by initiating a call to the file
    segment API endpoint. To proceed, you will need to compile a CSV file containing the relevant users
    (ensuring that the users are already present in MoEngage). It is essential to provide the public path
    of the file, which allows for downloading and identification of users in order to successfully create
    the file segment.


    Use the File Segment API to:

    * Create a new file segment

    * Add users to an existing segment

    * Remove users from an existing segment

    * Replace users from an existing segment
