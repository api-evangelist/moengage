  /customer/merge:
    post:
      tags:
      - User
      summary: Merge Users
      x-mint:
        content: "#### Types of user merging in MoEngage\n* Default or normal merge:\n  * MoEngage merges users with the same ID.\n  * Happens automatically, and no action is required from your side.\n* Manual merge:\n  * MoEngage merges users having different IDs.\n  * Does not happen automatically; you must call the Merge User API with the list of users to be merged along with their IDs.\n<Warning>\n * User Merging is a complex functionality and, if misused, can lead to data integrity issues. If the data passed to the API is incorrect, resulting in a merge of two unintended users, MoEngage will not be able to recover/rectify the data. The retained user would have erroneous data, and segmentation queries would not provide the right results.\n * MoEngage does not support transitive/canonical merging. For example, if user A is merged to B (A ->B) and then user B is merged to C (B ->C), in this scenario, events of user A are not moved to user C.\n * The Merge User API is not functional in workspaces where the [Identity Resolution](/user-guide/data/user-data/unified-identity-identity-resolution) feature is enabled.\n * If you are updating the [Unique Identifier](/developer-guide/unity-sdk/data-tracking/tracking-user-attributes) for a user, use the Merge User API at least 2 hours after you have updated the Unique Identifier.\n * Ensure that the data passed to the API is accurate. We recommend you test the merging starting with a small batch of users, such as 1, 5, 10, 20, 50, etc. Verify the merged data and users before proceeding with a bulk update.\n * A maximum of 50 users can be merged in a single call.\n * Payload size should not exceed 128 KB.\n</Warning>\n\n#### Rate limit\nThe rate limit is 1000 user updates per minute.\n"
      description: This API merges two users in MoEngage based on their ID, which is a client-defined identifier for a user. You can use this API when multiple profiles have been created for a single user. For example, you can merge a user registered once with a mobile number and once with an email ID. You can also merge duplicate users created due to integration or tech issues.
      parameters:
      - name: app_id
        in: query
        required: true
        description: This is the Workspace ID of your MoEngage account that must be passed with the request. You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeUserRequest'
      responses:
        '200':
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: 'This field contains the status of the request and specifies whether the request was successful. Supported values are : "success", "failure"'
                    example: success
                  operation:
                    type: string
                    description: This field contains “created” when there is no error in the payload, and the user merge is successful.
                    example: created
              examples:
                success_response:
                  summary: Successful request
                  value:
                    status: success
                    operation: created
        '400':
          description: This response is returned when the required parameters are missing from the request or when the provided parameters are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: This field contains the status of the request and specifies whether the request was a failure.
                    example: fail
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        description: A descriptive error message explaining why the request failed.
                      type:
                        type: string
                        description: The type or category of the error (e.g., Malformed JSON).
                      request_id:
                        type: string
                        description: A unique identifier for the request, useful for debugging.
              examples:
                malformed_json:
                  summary: Malformed JSON request
                  value:
                    status: fail
                    error:
                      message: Could not decode the request body. The JSON was incorrect or not   encoded as UTF-8.
                      type: Malformed JSON
                      request_id: pIvbWnGT
                app_blacklisted:
