                    example: success
                  type:
                    type: string
                    description: 'This field denotes the fetch type. Supported values are: "export_users".'
                    example: export_users
                  data:
                    type: object
                    description: "This field contains the list of users who were not found in MoEngage and returns the data specified for the list of users who were found in MoEngage.\n\nThis is the structure:\n```json\n{\n    \"users_not_found\": [\n        {\n            \"identifier_type\": \"customer_id\",\n            \"identifier\": \"<customer_id>\"\n        }\n    ],\n    \"users\": [\n        {\n            \"user_attributes\": {\n                \"<list of user attributes>\"\n            } \n        }\n    ]\n}\n```\n"
                    properties:
                      users_not_found:
                        type: array
                        description: An array of JSON Objects that contains the list of users who were not found in MoEngage.
                        items:
                          $ref: '#/components/schemas/IdentifierObject'
                      users:
                        type: array
                        description: Contains the user_attributes specified in the request for each user in specified in the request.
                        items:
                          type: object
                          properties:
                            user_attributes:
                              type: object
                              additionalProperties: true
                              example:
                                last_name: Doe
                                customer_id: john_doe
                                id: 62e79fb15ada55x123g987bu
              examples:
                success_response:
                  summary: Success Response
                  value:
                    status: success
                    type: export_users
                    data:
                      users_not_found:
                      - identifier_type: customer_id
                        identifier: john_doe
                      users:
                      - user_attributes:
                          last_name: Doe
                          customer_id: john_doe
                          name: John
                          custom_user_attr: 12345
                          id: 62e79fb15ada55x123g987bu
        '400':
          description: This response is returned when the required parameters APP KEY, user_id, and so on are missing from the request or when the provided params are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: This field contains the status of the request and specifies whether the request was a failure.
                    example: fail
                  error:
                    type: object
                    properties:
