                items:
                  type: string
                  enum:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
                  - SATURDAY
                  - SUNDAY
          description: 'Configuration for repeating on specific weeks of the month.

            '
    AdvancedDetails:
      type: object
      description: 'Advanced Push delivery settings, including notification expiration and per-platform priority.


        For runnable iOS APNS priority and Android priority examples, refer to [Advanced Push settings](/api/campaigns/audience-scheduling-delivery-reference#advanced-push-settings).

