  parameters:
    Idempotency-Key-Required:
      name: Idempotency-Key
      in: header
      required: true
      description: 'UUID v4. Required on all `POST` and `PATCH` requests except `POST /v5/campaigns/{campaign_id}/validate`. Repeating the same key returns the same response body.

        '
      schema:
        type: string
        format: uuid
    X-MOE-Scopes:
      name: X-MOE-Scopes
      in: header
      required: false
      description: 'Caller''s effective Campaigns permissions. When requests pass through the MoEngage IAM gateway, the gateway injects this header from the permissions tied to your API key, and the service treats it as the source of truth. The service reads only the `campaigns:` entry.


        Action vocabulary: `view` (read), `create_manage` (create and edit drafts), and `create_manage_publish` (reserved for future publish support). The hierarchy is `create_manage_publish` ⟹ `create_manage` ⟹ `view`.


        Required action by operation:

        - `PATCH /v5/campaigns/{campaign_id}` (component edits) requires `create_manage`.


        If your effective permissions do not satisfy the required action, the API returns `403`. Other V5 routes are not gated by this header in the current release.

        '
      schema:
        type: string
      example: campaigns:create_manage
    X-MOE-Request-Id:
      name: X-MOE-Request-Id
      in: header
      required: true
