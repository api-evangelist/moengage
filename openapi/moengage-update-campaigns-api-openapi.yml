      - send_email_if_personalization_fails
      - sender_logo
      - sender_logo_type
      properties:
        send_email_if_personalization_fails:
          type: boolean
          description: 'Whether to send the email if personalization of any Gmail annotation field fails.


            **Required** when `gmail_annotations` is present.

            '
          example: true
        sender_logo:
          type: string
          description: 'The sender logo shown in the Gmail annotation.


            Accepts a valid HTTPS URL or a MoEngage personalization token.


            **Required** when `gmail_annotations` is present.

            '
          example: https://example.com/logo.png
        sender_logo_type:
          type: string
          enum:
          - image_url
          - uploaded_image
          description: 'The source type of the sender logo.


            **Required** when `sender_logo` is provided.

            '
          example: image_url
        deal_card:
          description: 'The Deal Card annotation.


            **Optional.** Use either `deal_card` or `product_carousel` — not both.

            '
          allOf:
          - $ref: '#/components/schemas/GmailAnnotationsDealCard'
        product_carousel:
          description: 'The Product Carousel annotation.


            **Optional.** Use either `product_carousel` or `deal_card` — not both.

            '
          allOf:
          - $ref: '#/components/schemas/GmailAnnotationsProductCarousel'
