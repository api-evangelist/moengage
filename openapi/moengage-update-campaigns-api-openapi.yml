          type: string
          description: 'How often the limit and metrics are applied (e.g., daily, weekly, monthly).

            '
    GmailAnnotations:
      type: object
      description: 'Gmail Annotations shown in Gmail''s Promotions tab. Two annotation types are supported: `deal_card` and `product_carousel`. These are mutually exclusive — include only one per campaign.


        **Note:** `gmail_annotations` is only supported when `content_type` is `PROMOTIONAL`. Using it with `TRANSACTIONAL` returns a `400` error.

        '
