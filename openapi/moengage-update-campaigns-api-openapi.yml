  /global-control-group/users:
    put:
      operationId: update_global_control_group
      summary: Update Global Control Group
      description: 'This API adds or removes users from the Global Control Group (GCG) in MoEngage. Provide a publicly accessible CSV of user IDs and specify whether to add or remove those users.

        '
      x-mint:
        content: '<Warning>

          **Not available in V5**


          This endpoint is not yet available in V5. Use this V1 endpoint at `PUT /core-services/v1/global-control-group/users` until V5 support is added.

          </Warning>


          #### Rate Limit

          The rate limit is 10 RPM.


          <Note>

          - One file-processing request must complete before the next API call is accepted.

          - Currently, only publicly accessible Amazon S3 URLs are supported for `file_url`.

          - The Global Control Group must already be initialized with the **Upload Users** option before this API can be used. This API does not support the **Random allocation** option.

          - When the GCG base is successfully updated, subsequent runs of existing campaigns use the updated list.

          - Once file processing is completed, an email is sent to the user identified by `updated_by` summarizing the number of users successfully processed, the number of users that failed, and the possible reasons.

          </Note>

          '
      tags:
      - Update Campaigns
      parameters:
      - $ref: '#/components/parameters/MOE-APPKEY_2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalControlGroupRequest'
            examples:
              add_users:
                summary: Add Users
                value:
                  request_id: '{{request_id}}'
                  file_url: https://example.csv
                  action_type: add
                  updated_by: john.doe@xyz.com
              remove_users:
                summary: Remove Users
                value:
                  request_id: '{{request_id}}'
                  file_url: https://example.csv
                  action_type: remove
                  updated_by: john.doe@xyz.com
      responses:
        '204':
          description: No Content - The request was processed successfully. There is no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: Internal Server Error - An unexpected error occurred while processing this request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      title:
                        type: string
                        description: A short title for the error.
                      description:
                        type: string
                        description: A detailed, human-readable explanation of the error.
                      code:
                        type: string
                        description: Internal error code, if provided.
              example:
                error:
                  title: Server Error
                  description: An unexpected error was encountered while processing this request. Please contact Moengage team
                  code: <code>
