  /campaigns/status:
    post:
      operationId: change_campaign_status
      summary: Change Campaign Status
      description: |
        This API updates the status of campaigns to stop, pause, or resume them. You can only change the status of campaigns created via the [Create Campaign API](https://www.moengage.com/docs/api/create-campaigns/create-campaign) (not dashboard-created campaigns).

      x-mint:
        content: |
          <Note>
          **Differences in V5**

          `PATCH /v5/campaigns/{campaign_id}/status` accepts one campaign ID as a path parameter per request. V1 accepts a `campaign_ids` array of up to 10 IDs per request. To perform bulk status changes in V5, call the endpoint once per campaign ID.

          See [Update Campaign Status (V5)](/api/update-campaigns/update-campaign-status-v5).
          </Note>

          <Note>
            Currently, you can use this API to change the status of Email and Push campaigns. You can update the following statuses of the campaigns:
              - Stop a scheduled One-time campaign (Email and Push)
              - Pause and resume a running Periodic or Event-triggered Email campaign.
              - Pause and resume the following running Push campaigns:
                - Periodic
                - Event-triggered
                - Device-triggered
                - Location-triggered
          </Note>

          #### Rate Limits

          | Rate Limit Name | Rate Limit |
          | :--- | :--- |
          | change campaign status per second | The total number of change campaign status requests per second per client is 10. |
          | change campaign status per minute | The total number of change campaign status requests per minute per client allowed is 100. |
          | change campaign statusper hour | The total number of change campaign status requests per hour per client allowed is 6000. | 

            <Note>
              **Notes**
              * Breaching the limits will reject the request.
              * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.
            </Note>
        
      tags:
        - Update Campaigns
      parameters:
        - $ref: '#/components/parameters/MOE-APPKEY'
      requestBody:
        description: Send campaign status change request with action and campaign IDs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignStatusChangeRequest'
            examples:
              pause_campaign:
                summary: Pause Campaign
                value:
                  request_id: "status_change_pause"
                  action: "PAUSE"
                  campaign_ids: ["camp_periodic_123"]
              resume_campaign:
                summary: Resume Campaign
                value:
                  request_id: "status_change_resume"
                  action: "RESUME"
                  campaign_ids: ["camp_periodic_123"]
              stop_campaign:
                summary: Stop Scheduled Campaign
                value:
                  request_id: "status_change_stop"
                  action: "STOP"
                  campaign_ids: ["camp_onetime_456"]
              batch_pause:
                summary: Pause Multiple Campaigns
                value:
                  request_id: "status_batch_pause"
                  action: "PAUSE"
                  campaign_ids: 
                    - "camp_periodic_001"
                    - "camp_periodic_002"
                    - "camp_event_003"
      responses:
        '200':
          description: |
            Campaign status changed successfully. No content returned.
            
            For a successful 200 response, the API does not return any content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /campaigns/{parent_campaign_id}/executions:
    post:
      operationId: get_child_campaigns
      summary: Get Child Campaigns
      description: |
        This API retrieves child campaign execution details for Periodic or Business Event-triggered campaigns. Use this API to track execution history of recurring campaigns and monitor the performance of individual instances.
      x-mint:
        content: |
          <Warning>
          **Not available in V5**

          This endpoint is not yet available in V5. Use this V1 endpoint at `POST /core-services/v1/campaigns/{parent_campaign_id}/executions` until V5 support is added.
          </Warning>

          #### Information Retrieved
          - Child campaign IDs
          - Sent time for each execution
          - Status of each child campaign
          - Total number of times the parent campaign has been executed
          
          <Note>
          **Note**
          - Currently, you can use this API to get the child of Periodic and Business Event-triggered Email and Push campaigns.
          - You can only retrieve child campaigns for campaigns created via the [Create Campaign API](https://www.moengage.com/docs/api/create-campaigns/create-campaign).
          - Results are paginated with a maximum of 15 children per page.
          </Note>

          #### Rate Limits

          | Rate Limit Name | Rate Limit |
          | :--- | :--- |
          | get child campaign per second | The total number of get child campaigns requests per second per client allowed is 10. |
          | get child campaign per minute | The total number of get child campaigns requests per minute per client allowed is 100. |
          | get child campaign per hour | The total number of get child campaigns requests per hour per client allowed is 6000. | 

          <Note>
           **Notes**
           * Breaching the limits will reject the request.
           * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.
          </Note>

         
      tags:
        - Get Campaign Details
      parameters:
        - name: parent_campaign_id
          in: path
          required: true
          description: |
            The unique ID of the parent campaign (Periodic or Business Event-triggered).
            
            You can fetch the parent campaign ID using the Search Campaigns API.
          schema:
            type: string
          example: "camp_periodic_parent_123"
        - $ref: '#/components/parameters/MOE-APPKEY'
      requestBody:
        description: Provide pagination parameters for retrieving child campaign executions.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetChildCampaignsRequest'
            examples:
              get_periodic_children:
                summary: Get Periodic Campaign Children
                value:
                  request_id: "child_req_12345"
                  page: 1
                  limit: 15
              get_business_event_children:
                summary: Get Business Event Children
                value:
                  request_id: "child_req_67890"
                  page: 1
                  limit: 10
              get_second_page:
                summary: Get Second Page of Children
                value:
                  request_id: "child_req_page2"
                  page: 2
                  limit: 15
      responses:
        '200':
          description: Successfully retrieved child campaign execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildCampaignsResponse'
              examples:
                periodic_executions:
                  summary: Periodic Campaign Executions
                  value:
                    executions:
                      - campaign_id: "camp_child_001"
                        sent_time: "2024-06-24T14:30:18.908000"
                        status: "Sent"
                      - campaign_id: "camp_child_002"
                        sent_time: "2024-06-24T15:27:45.971000"
                        status: "Sent"
                      - campaign_id: "camp_child_003"
                        sent_time: "2024-06-24T15:47:43.528000"
                        status: "Sent"
                      - campaign_id: "camp_child_004"
                        sent_time: "2024-06-24T15:54:26.254000"
                        status: "Sent"
                      - campaign_id: "camp_child_005"
                        sent_time: "2024-06-24T16:35:01.834000"
                        status: "Sending"
                    total_instances: 8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /global-control-group/users:
    put:
      operationId: update_global_control_group
      summary: Update Global Control Group
      description: |
        This API adds or removes users from the Global Control Group (GCG) in MoEngage. Provide a publicly accessible CSV of user IDs and specify whether to add or remove those users.
      x-mint:
        content: |
          <Warning>
          **Not available in V5**

          This endpoint is not yet available in V5. Use this V1 endpoint at `PUT /core-services/v1/global-control-group/users` until V5 support is added.
          </Warning>

          #### Rate Limit
          The rate limit is 10 RPM.

          <Note>
          - One file-processing request must complete before the next API call is accepted.
          - Currently, only publicly accessible Amazon S3 URLs are supported for `file_url`.
          - The Global Control Group must already be initialized with the **Upload Users** option before this API can be used. This API does not support the **Random allocation** option.
          - When the GCG base is successfully updated, subsequent runs of existing campaigns use the updated list.
          - Once file processing is completed, an email is sent to the user identified by `updated_by` summarizing the number of users successfully processed, the number of users that failed, and the possible reasons.
          </Note>
      tags:
        - Update Campaigns
      parameters:
        - $ref: '#/components/parameters/MOE-APPKEY'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalControlGroupRequest'
            examples:
              add_users:
                summary: Add Users
                value:
                  request_id: "{{request_id}}"
                  file_url: "https://example.csv"
                  action_type: "add"
                  updated_by: "john.doe@xyz.com"
              remove_users:
                summary: Remove Users
                value:
                  request_id: "{{request_id}}"
                  file_url: "https://example.csv"
                  action_type: "remove"
                  updated_by: "john.doe@xyz.com"
      responses:
        '204':
          description: No Content - The request was processed successfully. There is no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: Internal Server Error - An unexpected error occurred while processing this request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      title:
                        type: string
                        description: A short title for the error.
                      description:
                        type: string
                        description: A detailed, human-readable explanation of the error.
                      code:
                        type: string
                        description: Internal error code, if provided.
              example:
                error:
                  title: "Server Error"
                  description: "An unexpected error was encountered while processing this request. Please contact Moengage team"
                  code: "<code>"