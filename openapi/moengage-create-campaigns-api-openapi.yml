    ActionFilter:
      type: object
      title: Action-based filters (with or without attributes)
      description: 'Filter based on user actions/events. Use inside `segmentation_details.included_filters.filters` or `trigger_condition.included_filters.filters`.

        '
      properties:
        filter_type:
          type: string
          enum:
          - actions
        action_name:
