          type: string
          description: 'Destination URL when the user clicks the annotation.


            **Required** when `product_set_data` is present.

            '
          example: https://example.com/shop
        product_count:
          type: integer
          description: 'Number of products to display.


            **Required** when `product_set_data` is present. Minimum 2, maximum 9.

            '
          minimum: 2
          maximum: 9
          example: 3
    AdvancedDetails_2:
      type: object
