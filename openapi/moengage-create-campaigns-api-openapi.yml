    GmailAnnotationsDealCard:
      type: object
      description: 'Deal Card annotation shown in Gmail''s Promotions tab. All four fields below are required when `deal_card` is present.

        '
      required:
      - description
      - discount_code
      - availability_starts
      - availability_ends
      properties:
        description:
          type: string
          description: 'Short deal description shown in the Gmail annotation.


            **Required** when `deal_card` is present.

            '
          example: Get 20% off on all orders above $50
        discount_code:
          type: string
          description: 'Promo or discount code displayed with the deal.


            **Required** when `deal_card` is present.

            '
          example: SAVE20
        availability_starts:
          type: string
          description: 'ISO 8601 datetime indicating when the deal becomes active. Use the timezone of the promotion, not your server or API caller timezone. Ensure the timezone matches the promotion''s local timezone so the deal displays the correct active and expiry times for your audience.


            **Accepted formats:**

            - UTC (`Z` suffix): `YYYY-MM-DDTHH:mm:ssZ` (for example, `2026-06-01T00:00:00Z`).

            - Positive offset: `YYYY-MM-DDTHH:mm:ss+HH:MM` (for example, `2026-06-01T00:00:00+05:30` for IST).

            - Negative offset: `YYYY-MM-DDTHH:mm:ss-HH:MM` (for example, `2026-06-01T00:00:00-07:00` for US Pacific PDT).


            **Common offsets:** IST `+05:30`, SGT `+08:00`, GST `+04:00`, CET `+01:00` or `+02:00` (DST), EST `-05:00`, EDT `-04:00`, PST `-08:00`, PDT `-07:00`, UTC `Z` or `+00:00`.


            **Required** when `deal_card` is present.

            '
          example: '2026-06-01T00:00:00Z'
        availability_ends:
          type: string
          description: 'ISO 8601 datetime indicating when the deal expires. Same format as `availability_starts`.


            Use the timezone of the promotion, not your server or API caller timezone. Ensure the timezone matches the promotion''s local timezone so the deal displays the correct active and expiry times for your audience.


            Must be at least 1 hour after `availability_starts`.


            **Required** when `deal_card` is present.

            '
          example: '2026-06-30T23:59:59Z'
