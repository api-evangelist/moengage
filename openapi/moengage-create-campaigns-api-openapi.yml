  /v5/campaigns/{campaign_id}/validate:
    post:
      operationId: validate_draft_campaign_v5
      summary: Validate Campaign (V5)
      description: 'Runs full publish-time validation (`DRAFT_PUBLISH`) on a saved draft without mutating it. Returns `valid: true` if the campaign would pass, or a list of blocking errors if it would not.


        All campaign data is read from the saved draft identified by `campaign_id` in the path. There is no channel-specific payload.

        '
      x-mint:
        content: '<Info>

          You do not need an idempotency key for this endpoint. The validate endpoint is read-only and safe to retry freely.

          </Info>


          ### Validation Modes


          The V5 API applies validation in two modes:


          | Mode | Triggered by | Strictness |

          | :--- | :--- | :--- |

          | Lenient | Draft create (`POST /v5/campaigns`) and component patch (`PATCH /v5/campaigns/{id}`) | Partial — individual components are validated in isolation as they are written |

          | Full (`DRAFT_PUBLISH`) | `POST /v5/campaigns/{id}/validate` and publish | Strict — all components are validated together as a complete, publish-ready campaign |


          Use this endpoint to catch `DRAFT_PUBLISH` failures before triggering a publish.


          ### Validation Failures


          All validation failures are blocking. There is no warning or non-blocking tier. A campaign that fails validation returns `valid: false` with a list of field-level errors. Each error identifies the `field` path and the `issue`.


          ### Channel-Specific Rules


          The following rules are enforced at `DRAFT_PUBLISH` for each channel:


          **Push**

          - `campaign_content` must be present and include content for all platforms listed in `basic_details.platforms`.

          - `template_type` must be valid for the target platform (Android, iOS, Web).

          - Platform-specific required fields (for example, `title` and `message` for Android basic templates) must be non-empty.


          **Email**

          - `connector.connector_type` and `connector.connector_name` must be present and match a connector configured in your workspace.

          - `basic_details.from_address` must be set and match a verified sender in the configured connector.

          - `basic_details.subscription_category` must be present for `PROMOTIONAL` content type.

          - `campaign_content` must include at least one variation with a non-empty `subject` and `html_content`.


          ### Delivery-Type-Specific Rules


          The following rules are enforced at `DRAFT_PUBLISH` based on `campaign_delivery_type`:


          | Delivery Type | Additional Requirements |

          | :--- | :--- |

          | `ONE_TIME`, `PERIODIC` | `scheduling_details` must be present. |

          | `AT_FIXED_TIME` scheduling | `scheduling_details.timezone` must be present. |

          | `PERIODIC` | `scheduling_details.periodic_details` must be present with a valid `sending_frequency`. |

          | `EVENT_TRIGGERED` | `trigger_condition` must be present with at least one `included_filters` entry. |

          | `DEVICE_TRIGGERED` | `trigger_condition` must be present. Trigger delay fields (`trigger_delay_type`, `trigger_delay_value`, `trigger_delay_granularity`) must **not** be set — they are only valid for `EVENT_TRIGGERED`. |

          | `BUSINESS_EVENT_TRIGGERED` | `basic_details.business_event` must be present. |

          | `LOCATION_TRIGGERED` | `basic_details.geofences` must contain at least one valid geofence entry. |


          #### Rate Limits


          | Rate Limit Name | Rate Limit |

          | :--- | :--- |

          | Validate campaign per second | The total number of validate campaign requests per second per client allowed is 10. |

          | Validate campaign per minute | The total number of validate campaign requests per minute per client allowed is 100. |

          | Validate campaign per hour | The total number of validate campaign requests per hour per client allowed is 6000. |

          '
      tags:
      - Create Campaigns
      parameters:
      - $ref: '#/components/parameters/MOE-APPKEY'
      - $ref: '#/components/parameters/X-MOE-Request-Id'
      - name: campaign_id
        in: path
        required: true
        description: 'Raw 24-char ObjectId of the campaign to validate. Use the `id` value returned in the Create Campaign response.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
                  description: Optional string (UUID v4 recommended) used to identify this validation call. Unlike other POST endpoints, this field is not required and does not enforce deduplication - the validate endpoint is read-only and safe to retry freely.
                  example: '{{request_id}}'
            examples:
              validate:
                summary: Validate a draft campaign
                value:
                  request_id: '{{request_id}}'
      responses:
        '200':
          description: Validation result - always returned regardless of whether the campaign passes or fails validation.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V5SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/V5ValidateResponse'
              examples:
                valid:
                  summary: Campaign passes validation
                  value:
                    response_id: abc-501
                    type: campaign
                    data:
                      valid: true
                invalid:
                  summary: Campaign fails validation
                  value:
                    response_id: abc-501
                    type: campaign
                    data:
                      valid: false
                      errors:
                      - field: campaign_content.content.push.android.basic_details.title
                        issue: title is required
                      - field: scheduling_details
                        issue: scheduling_details is required for publish
        '400':
          $ref: '#/components/responses/V5ValidationError'
        '401':
          $ref: '#/components/responses/V5Unauthorized'
        '500':
          $ref: '#/components/responses/V5InternalError'
    servers:
    - url: https://api-{dc}.moengage.com/
      description: MoEngage Campaigns API Server
      variables:
        dc:
          default: '01'
          description: Data center (DC) segment in the hostname. Replace `OX` with your workspace DC (01–06 or 101). See [Data centers](/api/introduction#data-centers).
  /campaigns:
    post:
      operationId: create_campaign
      summary: Create Campaign
      description: "This API creates a new Push or Email campaign in MoEngage with specified content, audience, and delivery settings.   \n"
      x-mint:
        content: "\n#### Rate Limits\n\n| Rate Limit Name | Rate Limit |\n| :--- | :--- |\n| Create campaign per second | The total number of create campaign requests per second per client allowed is 5. |\n| Create campaign per minute | The total number of create campaign requests per minute per client allowed is 25. |\n| Create campaign per hour | The total number of create campaign requests per hour per client allowed is 100. |  \n\n### Campaign Creation Limits\n\nYou can create 5 campaigns per minute, 25 campaigns per hour, and 100 campaigns per day.\n\n<Note>\n **Notes**\n * Higher limit (Total Calls): The system permits a higher volume of total API calls (for example, 120 calls) to accommodate potential failures or retries.\n * Minimum limit (Campaign Creation Limits): The system maintains a stricter quota for actual successful creations (100 campaigns per day).\n    \n    Example: If a client submits 120 requests and 20 fail, they successfully generate exactly 100 campaigns. Because the system applies the most restrictive threshold, the 100 successful operations trigger the quota limit, and the system issues a rate limit breach warning regardless of the total API calls made.\n * Breaching the limits will reject the request.\n * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.\n</Note>           \n"
      tags:
      - Create Campaigns
      parameters:
      - $ref: '#/components/parameters/MOE-APPKEY_2'
      requestBody:
        description: 'You can configure campaign content, audience, and scheduling details.

          **Note:** Use the tabs below to select your campaign type. The schema  will adapt based on the selected channel.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
            examples:
              push_one_time_android_ios:
                summary: Push - One-Time (Android & iOS)
                value:
                  request_id: push_req_12345
                  channel: PUSH
                  campaign_delivery_type: ONE_TIME
                  created_by: john.doe@example.com
                  basic_details:
                    name: Summer Sale Push
                    tags:
                    - activation
                    - sale
                    platforms:
                    - ANDROID
                    - IOS
                    platform_specific_details:
                      android:
                        push_amp_plus_enabled: true
                      ios:
                        send_to_all_eligible_device: true
                        exclude_provisional_push_devices: false
                        send_to_only_provisional_push_enabled_devices: false
                  campaign_content:
                    content:
                      push:
                        android:
                          template_type: BASIC
                          basic_details:
                            notification_channel: general
                            title: 50% Off Summer Sale!
                            message: Dont miss out on our biggest sale
                            default_click_action: DEEPLINKING
                            default_click_action_value: https://example.com/sale
                            key_value_pairs:
                            - key: promo_code
                              value: SUMMER50
                        ios:
                          template_type: BASIC
                          basic_details:
                            title: 50% Off Summer Sale!
                            message: Dont miss out on our biggest sale
                            default_click_action: DEEPLINKING
                            default_click_action_value: https://example.com/sale
                  segmentation_details:
                    included_filters:
                      filter_operator: and
                      filters:
                      - filter_type: user_attributes
                        data_type: string
                        name: uid
                        operator: exists
                  scheduling_details:
                    delivery_type: ASAP
                  delivery_controls:
                    campaign_throttle_rpm: 50000
                    ignore_frequency_capping: false
              email_one_time_promotional:
                summary: Email - One-Time Promotional
                value:
                  request_id: email_req_12345
                  channel: EMAIL
                  campaign_delivery_type: ONE_TIME
                  created_by: john.doe@example.com
                  basic_details:
                    name: Summer Sale Email
                    content_type: PROMOTIONAL
                    subscription_category: marketing
                    user_attribute_identifier: MOE_EMAIL_ID
                    tags:
                    - summer
                    - sale
                  connector:
                    connector_type: SENDGRID
                    connector_name: default
                  campaign_content:
                    content:
                      email:
                        subject: Exclusive Summer Sale - 50% Off!
                        preview_text: Limited time offer on all products
                        sender_name: MoEngage Store
                        from_address: noreply@example.com
                        reply_to_address: support@example.com
                        html_content: <!DOCTYPE html><html><body><h1>Summer Sale</h1><p>Get 50% off on all items!</p></body></html>
                  segmentation_details:
                    included_filters:
                      filter_operator: and
                      filters:
                      - filter_type: user_attributes
                        data_type: string
                        name: u_em
                        operator: exists
                  scheduling_details:
                    delivery_type: ASAP
                  delivery_controls:
                    campaign_throttle_rpm: 50000
                    ignore_frequency_capping: false
              email_with_gmail_annotations_deal_card:
                summary: Email - Gmail Annotations Deal Card (IST +05:30)
                value:
                  request_id: '{{request_id}}'
                  channel: EMAIL
                  campaign_delivery_type: ONE_TIME
                  created_by: '{{created_by}}'
                  basic_details:
                    name: Exclusive Deal Email
                    content_type: PROMOTIONAL
                    subscription_category: '{{subscription_category}}'
                    user_attribute_identifier: MOE_EMAIL_ID
                    send_only_double_opt_in_users: true
                    deduplication_attribute: '{{deduplication_attribute}}'
                    tags: []
                  connector:
                    connector_type: '{{connector_type}}'
                    connector_name: '{{connector_name}}'
                  campaign_content:
                    content:
                      email:
                        subject: Exclusive Deal Just for You
                        preview_text: Save big with our limited-time offer
                        sender_name: Your Brand
                        from_address: '{{from_address}}'
                        reply_to_address: '{{reply_to_address}}'
                        html_content: <!DOCTYPE html><html><body><p>Deal!</p></body></html>
                        gmail_annotations:
                          send_email_if_personalization_fails: true
                          sender_logo: https://example.com/logo.png
                          sender_logo_type: image_url
                          deal_card:
                            description: Get 20% off on all orders above $50
                            discount_code: SAVE20
                            availability_starts: '2026-06-01T00:00:00+05:30'
                            availability_ends: '2026-06-30T23:59:59+05:30'
                  segmentation_details:
                    is_all_user_campaign: false
                    included_filters:
                      filter_operator: and
                      filters:
                      - data_type: string
                        category: Tracked Custom Attribute
                        name: u_em
                        filter_type: user_attributes
                        case_sensitive: false
                        operator: exists
                        negate: false
                  scheduling_details:
                    delivery_type: ASAP
                  delivery_controls:
                    bypass_dnd: false
                    ignore_frequency_capping: false
                    count_for_frequency_capping: false
                    campaign_throttle_rpm: 3000
              email_with_gmail_annotations_product_carousel_manual:
                summary: Email - Gmail Annotations Product Carousel (Manual)
                value:
                  request_id: '{{request_id}}'
                  channel: EMAIL
                  campaign_delivery_type: ONE_TIME
                  created_by: '{{created_by}}'
                  basic_details:
                    name: Featured Products Email
                    content_type: PROMOTIONAL
                    subscription_category: '{{subscription_category}}'
                    user_attribute_identifier: MOE_EMAIL_ID
                    send_only_double_opt_in_users: true
                    deduplication_attribute: '{{deduplication_attribute}}'
                    tags: []
                  connector:
                    connector_type: '{{connector_type}}'
                    connector_name: '{{connector_name}}'
                  campaign_content:
                    content:
                      email:
                        subject: Featured Products This Week
                        preview_text: Discover our latest deals
                        sender_name: Your Brand
                        from_address: '{{from_address}}'
                        reply_to_address: '{{reply_to_address}}'
                        html_content: <!DOCTYPE html><html><body><p>Shop now!</p></body></html>
                        gmail_annotations:
                          send_email_if_personalization_fails: true
                          sender_logo: https://example.com/logo.png
                          sender_logo_type: image_url
                          product_carousel:
                            type: MANUAL
                            manual_data:
                              currency: USD
                              products:
                              - id: prod-001
                                headline: Wireless Headphones
                                original_price: '199.99'
                                discount_value: '30'
                                discount_type: PERCENT
                                promo_url: https://example.com/products/prod-001
                                product_image: https://example.com/images/prod-001.png
                              - id: prod-002
                                headline: Smart Watch
                                original_price: '299.99'
                                discount_value: '50'
                                discount_type: VALUE
                                promo_url: https://example.com/products/prod-002
                                product_image: https://example.com/images/prod-002.png
                  segmentation_details:
                    is_all_user_campaign: false
                    included_filters:
                      filter_operator: and
                      filters:
                      - data_type: string
                        category: Tracked Custom Attribute
                        name: u_em
                        filter_type: user_attributes
                        case_sensitive: false
                        operator: exists
                        negate: false
                  scheduling_details:
                    delivery_type: ASAP
                  delivery_controls:
                    bypass_dnd: false
                    ignore_frequency_capping: false
                    count_for_frequency_capping: false
                    campaign_throttle_rpm: 3000
              email_with_gmail_annotations_product_carousel_product_set:
                summary: Email - Gmail Annotations Product Carousel (Product Set)
                value:
                  request_id: '{{request_id}}'
                  channel: EMAIL
                  campaign_delivery_type: ONE_TIME
                  created_by: '{{created_by}}'
                  basic_details:
                    name: Recommended For You Email
                    content_type: PROMOTIONAL
                    subscription_category: '{{subscription_category}}'
                    user_attribute_identifier: MOE_EMAIL_ID
                    send_only_double_opt_in_users: true
                    deduplication_attribute: '{{deduplication_attribute}}'
                    tags: []
                  connector:
                    connector_type: '{{connector_type}}'
                    connector_name: '{{connector_name}}'
                  campaign_content:
                    content:
                      email:
                        subject: Picks Curated For You
                        preview_text: Personalized recommendations
                        sender_name: Your Brand
                        from_address: '{{from_address}}'
                        reply_to_address: '{{reply_to_address}}'
                        html_content: <!DOCTYPE html><html><body><p>Shop now!</p></body></html>
                        gmail_annotations:
                          send_email_if_personalization_fails: true
                          sender_logo: https://example.com/logo.png
                          sender_logo_type: image_url
                          product_carousel:
                            type: PRODUCT_SET
                            product_set_data:
                              product_set: product_set_12345
                              image_url: https://example.com/images/fallback.png
                              headline: Recommended For You
                              promo_url: https://example.com/shop
                              product_count: 3
                  segmentation_details:
                    is_all_user_campaign: false
                    included_filters:
                      filter_operator: and
                      filters:
                      - data_type: string
                        category: Tracked Custom Attribute
                        name: u_em
                        filter_type: user_attributes
                        case_sensitive: false
                        operator: exists
                        negate: false
                  scheduling_details:
                    delivery_type: ASAP
                  delivery_controls:
                    bypass_dnd: false
                    ignore_frequency_capping: false
                    count_for_frequency_capping: false
                    campaign_throttle_rpm: 3000
              push_event_triggered:
                summary: Push - Event Triggered
                value:
                  request_id: push_event_12345
                  channel: PUSH
                  campaign_delivery_type: EVENT_TRIGGERED
                  created_by: john.doe@example.com
                  basic_details:
                    name: Cart Abandonment Push
                    platforms:
                    - ANDROID
                    - IOS
                    platform_specific_details:
                      android:
                        push_amp_plus_enabled: true
                      ios:
                        send_to_all_eligible_device: true
                        exclude_provisional_push_devices: false
                        send_to_only_provisional_push_enabled_devices: false
                  trigger_condition:
                    included_filters:
                      filter_operator: and
                      filters:
                      - filter_type: actions
                        action_name: cart_abandoned
                        execution:
                          type: atleast
                          count: 1
                        executed: true
                        attributes:
                          filter_operator: and
                          filters: []
                    trigger_delay_type: DELAY
                    trigger_delay_value: 1
                    trigger_delay_granularity: HOURS
                    trigger_relation: AFTER
                  campaign_content:
                    content:
                      push:
                        android:
                          template_type: BASIC
                          basic_details:
                            notification_channel: general
                            title: Complete your purchase
                            message: Items in your cart are waiting
                            default_click_action: DEEPLINKING
                            default_click_action_value: myapp://cart
                  segmentation_details:
                    included_filters:
                      filter_operator: and
                      filters:
                      - filter_type: user_attributes
                        data_type: string
                        name: uid
                        operator: exists
                  scheduling_details:
                    delivery_type: AT_FIXED_TIME
                    start_time: '2024-12-01T10:00:00'
                    expiry_time: '2024-12-31T23:59:59'
                  delivery_controls:
                    bypass_dnd: false
                    ignore_frequency_capping: false
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCreateSuccessResponse'
              example:
                campaign_id: camp_abc123xyz
        '400':
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_request_id:
                  summary: Missing request_id
                  value:
                    error:
                      code: 400 Bad Request
                      message: request_id key is mandatory field
                      target: request_id
                      details:
                      - target: request_id
                        message: request_id key is mandatory field
                      request_id: '11'
                deduplication_attribute_invalid_type:
                  summary: deduplication_attribute - invalid type
                  value:
                    error:
                      code: 400 Bad Request
                      message: 'deduplication_attribute - Invalid value passed. Expected type: string, but got: int.'
                      target: basic_details
                      details:
                      - target: basic_details.deduplication_attribute
                        message: 'deduplication_attribute - Invalid value passed. Expected type: string, but got: int.'
                send_only_double_opt_in_users_invalid_type:
                  summary: send_only_double_opt_in_users - invalid type
                  value:
                    error:
                      code: 400 Bad Request
                      message: 'send_only_double_opt_in_users - Invalid value passed. Expected type: boolean, but got: string.'
                      target: basic_details
                      details:
                      - target: basic_details.send_only_double_opt_in_users
                        message: 'send_only_double_opt_in_users - Invalid value passed. Expected type: boolean, but got: string.'
                gmail_annotations_on_transactional:
                  summary: gmail_annotations used on TRANSACTIONAL campaign
                  value:
                    error:
                      code: 400 Bad Request
                      message: gmail_annotations is not supported for TRANSACTIONAL content type. It is only supported for PROMOTIONAL campaigns.
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations
                        message: gmail_annotations is not supported for TRANSACTIONAL content type. It is only supported for PROMOTIONAL campaigns.
                gmail_annotations_missing_sender_logo:
                  summary: sender_logo missing when gmail_annotations is present
                  value:
                    error:
                      code: 400 Bad Request
                      message: sender_logo is required when gmail_annotations is specified
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.sender_logo
                        message: sender_logo is required when gmail_annotations is specified
                gmail_annotations_invalid_sender_logo:
                  summary: sender_logo is not a valid HTTPS URL
                  value:
                    error:
                      code: 400 Bad Request
                      message: sender_logo must be a valid https URL
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.sender_logo
                        message: sender_logo must be a valid https URL
                deal_card_missing_field:
                  summary: Required deal_card field missing
                  value:
                    error:
                      code: 400 Bad Request
                      message: availability_starts is required when deal_card is specified
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.deal_card.availability_starts
                        message: availability_starts is required when deal_card is specified
                deal_card_invalid_end_time:
                  summary: availability_ends less than 1 hour after availability_starts
                  value:
                    error:
                      code: 400 Bad Request
                      message: End date and time must be a minimum of one hour later than the start date and time
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.deal_card
                        message: End date and time must be a minimum of one hour later than the start date and time
                product_carousel_minimum_products:
                  summary: Product carousel has fewer than 2 products
                  value:
                    error:
                      code: 400 Bad Request
                      message: Product carousel requires a minimum of 2 products
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel
                        message: Product carousel requires a minimum of 2 products
                product_set_product_count_exceeds_maximum:
                  summary: product_count exceeds maximum of 9
                  value:
                    error:
                      code: 400 Bad Request
                      message: product_count must be between 2 and 9
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.product_set_data
                        message: product_count must be between 2 and 9
                product_carousel_invalid_original_price:
                  summary: Manual product has invalid original_price
                  value:
                    error:
                      code: 400 Bad Request
                      message: original_price must be a valid number
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.manual_data.products[0].original_price
                        message: original_price must be a valid number
                product_carousel_invalid_discount_value:
                  summary: Manual product has invalid discount_value
                  value:
                    error:
                      code: 400 Bad Request
                      message: discount_value must be a valid number
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.manual_data.products[0].discount_value
                        message: discount_value must be a valid number
                product_carousel_invalid_promo_url:
                  summary: Manual product has invalid promo_url
                  value:
                    error:
                      code: 400 Bad Request
                      message: promo_url must be a valid https URL
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.manual_data.products[0].promo_url
                        message: promo_url must be a valid https URL
                product_carousel_empty_product_image:
                  summary: Manual product has empty product_image
                  value:
                    error:
                      code: 400 Bad Request
                      message: product_image (Image URL) cannot be empty
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.manual_data.products[0].product_image
                        message: product_image (Image URL) cannot be empty
                product_carousel_invalid_product_image_url:
                  summary: Manual product has invalid product_image URL
                  value:
                    error:
                      code: 400 Bad Request
                      message: product_image must be a valid https URL
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.manual_data.products[0].product_image
                        message: product_image must be a valid https URL
                product_set_not_found:
                  summary: Product set ID does not exist in the workspace
                  value:
                    error:
                      code: 400 Bad Request
                      message: product_set not found for the given workspace
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel.product_set_data
                        message: product_set not found for the given workspace
                product_sets_feature_not_enabled:
                  summary: Product Sets feature is not enabled for the workspace
                  value:
                    error:
                      code: 400 Bad Request
                      message: Product Sets is not enabled for this workspace
                      target: campaign_content.content
                      details:
                      - target: gmail_annotations.product_carousel
                        message: Product Sets is not enabled for this workspace
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api-{dc}.moengage.com/core-services/v1
      description: MoEngage Campaigns API Server
      variables:
        dc:
          default: '01'
          description: The ‘dc’ in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ‘dc’ in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101.
components:
  schemas:
    EmailCampaignContent:
      type: object
      description: 'Email content, locales, and A/B variations.


        For full `POST /v5/campaigns` request examples that include `campaign_content`, refer to `campaign_delivery_type` on `EmailCampaignCreateV5Request`, `VariationDetails`, and the Create Campaign Draft code samples.


        For Email content variants, including `html_content` versus `custom_template_id`, CC/BCC, attachments, and editor selection (`Froala Editor` versus `Ace Editor`), refer to [Email content](/api/campaigns/campaign-content-reference#email-content).

        '
      properties:
        locales:
          type: array
          items:
            type: string
          description: 'Additional locale names for multi-language campaigns. List only the non-default locales here (for example, `"en-US"`, `"es-ES"`). The `"default"` locale is always implicitly present and must not be included in this array.

            '
          example:
          - en-US
          - es-ES
        variation_details:
          $ref: '#/components/schemas/VariationDetails'
        content:
          type: object
          description: 'The campaign message payload. Two shapes are accepted:


            - **Flat shape (no locales or variations):** Pass a flat `email` object directly under `content`.

            - **Locale-keyed and variation-keyed shape:** Key by locale name, then by variation name: `content[locale_name][variation_name] = { email: { ... } }`. The `"default"` locale key is always required and serves as the fallback. Additional locale keys must match values listed in `locales`.


            For runnable payloads for both shapes, refer to [Content payload structure](/api/campaigns/campaign-content-reference#content-payload-structure).

            '
          properties:
            email:
              $ref: '#/components/schemas/EmailContent'
          additionalProperties:
            type: object
            description: Variation-keyed content blocks for a single locale.
            additionalProperties:
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/EmailContent'
    GoalEventAttribute:
      type: object
      description: Attributes associated with the conversion goal event.
      properties:
        name:
          type: string
          description: The name of the goal event attribute.
        condition:
          type: string
          description: The condition used while creating the goal (e.g., "is", "contains", "between").
        data_type:
          type: string
          enum:
          - STRING
          - DOUBLE
          - BOOL
          - NUMBER
          - GEOPOINT
          - DATETIME
          - ARRAY_DOUBLE
          - ARRAY_STRING
          - OBJECT
          - ARRAY_OBJECT
          description: The data type of the attribute.
        value:
          type: string
          description: 'The value of the goal event attribute.

            Supported data types: STRING, DOUBLE, BOOL, NUMBER, GEOPOINT, DATETIME, ARRAY_DOUBLE, ARRAY_STRING.

            '
        value1:
          type: string
          description: 'A secondary value, used for conditions like ''between''.

            Supported data types: STRING, DOUBLE, BOOL, NUMBER, GEOPOINT, DATETIME, ARRAY_DOUBLE, ARRAY_STRING.

            '
        negate:
          type: boolean
          description: Whether to negate the filter condition.
        value_type:
          type: string
          description: The type of value being filtered.
        array_filter_type:
          type: string
          description: The logical filter type for array attributes.
        filters:
          type: array
          items:
            type: object
          description: A list of sub-filters used when data_type is OBJECT or ARRAY_OBJECT.
        is_case_sensitive:
          type: boolean
          description: Whether the goal event attribute is case-sensitive.
    KeyValuePair:
      type: object
      description: A custom key-value pair attached to the push payload.
      properties:
        key:
          type: string
          description: The key name.
        value:
          type: string
          description: The value.
    V5SuccessEnvelope:
      type: object
      properties:
        response_id:
          type: string
        type:
          type: string
          example: campaign
        data:
          type: object
    Geofences:
      type: object
      description: 'Geofence location details for location-triggered campaigns.


        **Required** for LOCATION_TRIGGERED campaigns.


        For per-`triggered_at` runnable payloads (`ENTRY`, `EXIT`, `dwell`) and the casing distinction between `ENTRY`/`EXIT` (uppercase) and `dwell` (lowercase), refer to [Geofence targeting](/api/campaigns/audience-scheduling-delivery-reference#geofence-targeting).

        '
      required:
      - name
      - latitude
      - longitude
      - radius
      - response_time_value
      - response_time_granularity
      - triggered_at
      properties:
        name:
          type: string
          description: The unique name of the geofence location being targeted.
        latitude:
          type: string
          description: The latitude coordinate for the center of the geofence area.
        longitude:
          type: string
          description: The longitude coordinate for the center of the geofence area.
        radius:
          type: string
          description: The radius in meters from the center point that defines the boundary of the geofence.
        dwell_time_value:
          type: string
          description: 'The numeric value for the time to wait before sending the message after the trigger condition is met.


            **Required** when triggered_at is set to "dwell".

            '
        dwell_time_granularity:
          type: string
          enum:
          - MINUTES
          - HOURS
          - DAYS
          description: 'The time unit for the dwell_time_value.


            **Required** when triggered_at is set to "dwell".

            '
        response_time_value:
          type: string
          description: The numeric value for the time to wait before sending the message after the trigger condition is met.
        response_time_granularity:
          type: string
          enum:
          - MINUTES
          - HOURS
          - DAYS
          description: The time unit for the response_time_value.
        triggered_at:
          type: string
          enum:
          - ENTRY
          - EXIT
          - dwell
          description: 'The user action that triggers the campaign (when user enters/exits the geofence).

            '
    EmailCampaignCreateV5Request:
      title: Email Campaign
      type: object
      description: 'Request body for creating an Email campaign draft via `POST /v5/campaigns`.


        Required fields are `channel`, `campaign_delivery_type`, and `created_by`. `connector` is required before the campaign can be published or sent for testing, but can be added later via `PATCH` (progressive creation). `campaign_content` can be added when the message content is ready.



        For the component-level schemas with conditional rules:

        - [Campaign content reference](/api/campaigns/campaign-content-reference) — `basic_details`, `campaign_content` (`html_content` and `custom_template_id`), `variation_details`, and `connector`.

        - [Audience and delivery reference](/api/campaigns/audience-scheduling-delivery-reference) — `trigger_condition`, `segmentation_details`, `scheduling_details`, `delivery_controls`, `conversion_goal_details`, `control_group_details`, `utm_params`, and `campaign_audience_limit`.

        '
      required:
      - channel
      - campaign_delivery_type
      - created_by
      properties:
        request_id:
          type: string
          description: 'A unique identifier for this campaign creation request.


            **Important:** After successful campaign creation, do not reuse this request_id for the next 1 day. If campaign creation fails, you can immediately retry with the same request_id.

            '
          example: '{{request_id}}'
        channel:
          type: string
          enum:
          - EMAIL
          description: The campaign channel. One of `PUSH` or `EMAIL`.
        campaign_delivery_type:
          type: string
          enum:
          - ONE_TIME
          - PERIODIC
          - EVENT_TRIGGERED
          - BUSINESS_EVENT_TRIGGERED
          description: 'The delivery type of the campaign.


            For full request payloads per delivery type, see the code examples on this page.

            '
        created_by:
          type: string
          format: email
          description: The email ID of the user creating this campaign.
          example: john.doe@example.com
        basic_details:
          $ref: '#/components/schemas/EmailBasicDetailsV5'
        trigger_condition:
          $ref: '#/components/schemas/EmailTriggerCondition'
        connector:
          $ref: '#/components/schemas/Connector'
        campaign_content:
          $ref: '#/components/schemas/EmailCampaignContent'
        segmentation_details:
          $ref: '#/components/schemas/SegmentationDetails'
        scheduling_details:
          $ref: '#/components/schemas/SchedulingDetails'
        delivery_controls:
          $ref: '#/components/schemas/EmailDeliveryControls'
        conversion_goal_details:
          $ref: '#/components/schemas/ConversionGoalDetails'
        control_group_details:
          $ref: '#/components/schemas/ControlGroupDetails'
        utm_params:
          $ref: '#/components/schemas/UTMParams'
        campaign_audience_limit:
          $ref: '#/components/schemas/CampaignAudienceLimit'
    AndroidTimer:
      type: object
      description: 'Timer configuration for Timer and Timer with Progress Bar templates.


        **Required for:** TIMER and TIMER_WITH_PROGRESS_BAR templates

        '
      properties:
        timer_ends_at:
          type: string
          enum:
          - DURATION
          - SPECIFIC_TIME_USER_TIMEZONE
          - SPECIFIC_TIME_CAMPAIGN_TIMEZONE
          description: How the timer's endpoint is determined.
        specific_time:
          type: string
          format: date-time
          description: 'The specific time when the timer ends.


            **Required** when personalized_value is true.

            '
        time_period:
          type: string
          description: 'The time period for the timer.


            **Required** when timer_ends_at is SPECIFIC_TIME_USER_TIMEZONE or SPECIFIC_TIME_CAMPAIGN_TIMEZONE.

            '
        personalized_value:
          type: boolean
          description: 'Whether the timer duration is personalized per user.


            If false, all users get the same duration.

            '
        duration_hour:
          type: string
          description: 'The number of hours the timer will run for.


            **Required** when personalized_value is false.

            '
          example: '2'
        duration_minute:
          type: string
          description: 'The number of minutes the timer will run for (in addition to hours).


            **Required** when personalized_value is false.

            '
          example: '30'
    ConversionGoalDetails:
      type: object
      description: 'Configuration for tracking campaign conversion goals.


        For runnable single-goal and multi-goal examples, refer to [Conversion goal tracking](/api/campaigns/audience-scheduling-delivery-reference#conversion-goal-tracking).

        '
      properties:
        attribution_window_in_hours:
