      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: 401 Authentication error
              message: Authentication required
              details:
              - code: InvalidValue
                target: APP_SECRET_KEY
                message:
                - code: InvalidValue
                  target: APP_SECRET_KEY
                  message: Invalid APP_SECRET_KEY is provided.
