            Always use the backend attribute name (for example, `u_em`), not the display label (for example, `Email (Standard)`).


            Ensure the Brand Deduplication feature is enabled for your workspace.

            '
          default: ''
          example: u_em
    PersonalizationDetails_2:
      type: object
      description: "Override values for personalizing campaign content during testing.\n\n**Important**: \n  - When you pass personalization details in the personalization_details object of this API, MoEngage uses those details to personalize the user attributes or event attributes present in the content instead of the attributes present in the user profile.\n  - You can use this API only for 10 users at a time.\n  - The same personalization details are used across all users. For example, you pass the first name as Dave in personalization details, you have used the first name in the content, and there are 10 users. In this case, all 10 users will get the same first name (Dave).\n"
