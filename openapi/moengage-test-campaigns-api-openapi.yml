    PersonalizedPreviewRequest:
      type: object
      required:
      - request_id
      - personalization_content
      - personalization_details
      properties:
        request_id:
          type: string
          description: A unique identifier for this personalization preview request.
          example: preview_req_12345
        personalization_content:
          type: object
          description: 'The content to personalize.


            **Note:** Either `payload` or `custom_template_data` must be provided.

            '
          properties:
            payload:
              type: object
              additionalProperties: true
              description: 'Flexible key-value pairs containing content to personalize.


                Can include any name and number of keys with HTML, text, or Jinja templates.

                '
              example:
                email_html: <!DOCTYPE html><html><body><p>Hi {{UserAttribute['First Name']}}</p></body></html>
            custom_template_data:
              type: object
              description: 'Custom template information.


                **Required fields when using custom templates:**

                - template_id

                - version

                '
              properties:
                template_id:
                  type: string
                  description: The ID of the custom template.
                  example: 5b7d04c6-8ddc-4957-80d9-c67266079609
                version:
                  type: string
                  description: The version of the custom template.
                  example: '1'
        user_details:
          type: object
          description: 'Information about the user to preview for.


            **Note:** If using user_details, both `identifier` and `identifier_value` are mandatory.

            '
          properties:
            identifier:
              type: string
              description: 'The type of unique identifier used to specify the user.


                Can be ID, email, phone number, etc.

                '
              example: ID
            identifier_value:
              type: string
              description: The corresponding value of the selected identifier.
              example: USER_12345
        personalization_details:
          type: object
          description: "**Important**:\n  - When you pass personalization_details, MoEngage uses those values to personalize content instead of actual user profile data.\n  - Attributes must exist in the MoEngage dashboard.\n  - If an attribute does not exist and default value is not “MOE_NOT_SEND”, it will appear empty.\n  - Event attributes can be used when the same event is used for the campaign.\n  - You can use event attributes to personalize content APIs when the same event is used for the campaign.\n"
          required:
          - channel
          properties:
            channel:
              type: string
              enum:
              - EMAIL
              - PUSH
              - SMS
              description: The channel for which to preview personalized content.
            event_name:
              type: string
              description: 'The event name for personalization.


                **Required** if event attributes are present in the payload.

                '
              example: App_Opened
            user_attributes:
              type: object
              additionalProperties: true
              description: 'Key-value pairs representing specific user characteristics.


                Can contain any name and number of keys.

                '
              example:
                First Name: John
                Last Name: Doe
                Gender: Male
            event_attributes:
              type: object
              additionalProperties: true
              description: 'Key-value pairs describing properties of a particular event.


                Can contain any name and number of keys.

                '
              example:
                App_Version: 1.0.2
                Campaign Name: Summer Sale
