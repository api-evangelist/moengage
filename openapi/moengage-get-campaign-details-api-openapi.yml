          example: You have a new message waiting for you
        subtitle:
          type: string
          description: The subtitle displayed below the main title.
        allow_bg_refresh:
          type: boolean
          description: Whether to allow the app to be woken up in the background to refresh content.
        rich_media_type:
          type: string
          enum:
          - Image
          - Video
          - GIF
          description: 'The type of rich media to be included in the notification.


            **Supported Templates:** Basic

            '
        rich_media_value:
          type: string
          format: uri
          description: 'The URL of the rich media asset specified in the rich_media_type field.


            **Supported Templates:** Basic

            '
        image_url:
          type: string
          format: uri
          description: 'The URL of a large image to be displayed within the notification content.


            **Note:** Required when template_type is SIMPLE_IMAGE_CAROUSEL.

            '
        input_gif_url:
          type: string
          format: uri
          description: 'The URL for the GIF media used in the push campaign content.


            **Supported Templates:** Basic, Stylized Basic

            '
        carousel_content:
          $ref: '#/components/schemas/IOSCarouselContent'
        default_click_action:
          type: string
          enum:
          - DEEPLINKING
          - NAVIGATE_TO_A_SCREEN
          - RICH_LANDING
          description: The action performed when the main body of the notification is tapped.
        default_click_action_value:
          type: string
          description: The URL or deep link associated with the default click action.
        key_value_pairs:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
          description: Custom key-value pairs sent with the push payload for in-app handling.
    CampaignAudienceLimit:
      type: object
      description: "Configuration for capping the number of users a campaign can reach (max-send).\n\nCampaign Audience Limit (also called max-send) caps how many users a single campaign can reach. Use it to control reach on high-volume campaigns and protect users from over-messaging. The cap can apply across the campaign's full lifetime (`frequency: TOTAL`) or per send instance (`frequency: INSTANCE`).\n\nFor runnable `TOTAL` (lifetime cap), `INSTANCE` (per-send cap, Periodic Push only), and disabled-cap examples, refer to [Campaign audience cap](/api/campaigns/audience-scheduling-delivery-reference#campaign-audience-cap).\n\n**Supported channels:** Email, Push.\n\n**Supported delivery types:**\n- All delivery types support `frequency: TOTAL` (lifetime cap).\n- `frequency: INSTANCE` (per-send cap) is supported only for **Periodic Push** campaigns.\n- `campaign_audience_limit` is not supported for `BROADCAST_LIVE_ACTIVITY`.\n\n**Flag-gated feature:** This feature is not enabled by default for any workspace and requires\nexplicit activation by your MoEngage account team. If you include `campaign_audience_limit` in\na request on a workspace where the flag has not been enabled, the API returns a `400` with the\nfollowing error body:\n\n```json\n{\n  \"error\": {\n    \"code\": \"VALIDATION_FAILED\",\n    \"message\": \"Campaign Audience Limit feature is not enabled for this db\",\n    \"target\": \"campaign_audience_limit\",\n    \"details\": [\n      {\n        \"target\": \"campaign_audience_limit\",\n        \"message\": \"Campaign Audience Limit feature is not enabled for this db\"\n      }\n    ]\n  },\n  \"response_id\": \"{{response_id}}\"\n}\n```\n\nWhen `is_campaign_audience_limit_enabled` is `true`, the fields `metric`, `frequency`, and\n`limit` are all required. When set to `false`, those three fields must not be provided.\n\nFor `ONE_TIME` campaigns, only `limit` and `is_campaign_audience_limit_enabled` are supported. Do not pass `metric` or `frequency`, they are only valid for `PERIODIC` and `EVENT_TRIGGERED` campaigns. \nPassing them for a ONE_TIME campaign causes the validate API to fail. \n"
      properties:
        is_campaign_audience_limit_enabled:
          type: boolean
          description: 'Whether the campaign audience limit is active. Set to `true` to enforce the cap; `false` to disable.


            When `true`, `metric`, `frequency`, and `limit` are all required.

            When `false`, `metric`, `frequency`, and `limit` must not be provided.

            '
        metric:
          type: string
          description: 'The type of send event counted toward the limit. Must be uppercase.


            **Required** when `is_campaign_audience_limit_enabled` is `true`.

            '
          enum:
          - SENT
          example: SENT
        frequency:
          type: string
          description: 'The window over which the limit is applied. Must be uppercase.


            - `TOTAL` - applies the cap across the full lifetime of the campaign. Supported for all delivery types on both Email and Push.

            - `INSTANCE` - applies the cap per campaign instance (for example, per periodic send). **Valid only for Push `PERIODIC` campaigns.** For all other delivery types, use `TOTAL`.


            **Required** when `is_campaign_audience_limit_enabled` is `true`.

            '
          enum:
          - TOTAL
          - INSTANCE
          example: TOTAL
        limit:
          type: integer
          minimum: 1
          maximum: 9999999999
          description: 'The maximum number of users who can receive this campaign (or per instance, when

            `frequency` is `INSTANCE`). Must be between 1 and 9,999,999,999.


            **Required** when `is_campaign_audience_limit_enabled` is `true`.

            '
          example: 100000
    EmailBasicDetailsV5:
      type: object
      description: 'Identifying metadata for the Email campaign, including name, team, tags, and subscription category.


        **Conditional requirements:** `name`, `content_type`, `user_attribute_identifier`, and `subscription_category` are strictly required only when using the `/v5/campaigns/test` endpoint in **inline mode**. They are not required at campaign creation time (V5 supports progressive creation, where components are added later via PATCH) and are not needed in **draft mode** tests, where content comes from the saved draft.

        '
      properties:
        name:
          type: string
          description: Any string name for the test or campaign.
          example: Summer Sale Email
        business_event:
          type: string
          description: The business event to be mapped to the campaign.
          example: user_signup
        content_type:
          type: string
          enum:
          - PROMOTIONAL
          - TRANSACTIONAL
          description: The type of content in the campaign. "PROMOTIONAL" or "TRANSACTIONAL".
        subscription_category:
          type: string
          description: 'The subscription category for promotional email campaigns. **Must match a valid category configured in your workspace.**


            **Required** for PROMOTIONAL email campaigns and inline tests.

            '
          example: marketing
        tags:
          type: array
          items:
            type: string
          description: Tags that provide context about the campaign's nature or theme.
          example:
          - activation
          - summer_sale
        team:
          type: string
          description: The name of the team collaborating on this campaign.
          example: marketing_team
        user_attribute_identifier:
          type: string
          default: Email (Standard)
          description: 'The user attribute that stores the recipient email address. Use "Email (Standard)" for email channels.

            '
          example: Email (Standard)
    Goal:
      type: object
      description: A single conversion goal configuration.
      properties:
        goal_name:
          type: string
          description: The name of the goal.
          example: Goal 1
        goal_event_name:
          type: string
          description: The event name associated with this goal.
        goal_event_attribute:
          $ref: '#/components/schemas/GoalEventAttribute'
        is_primary_goal:
          type: boolean
          description: Whether this is the primary goal.
        revenue_attribute:
          type: string
          description: The revenue attribute to track.
        revenue_currency:
          type: string
          description: The currency for revenue tracking.
    ActionFilter:
      type: object
      title: Action-based filters (with or without attributes)
      description: 'Filter based on user actions/events. Use inside `segmentation_details.included_filters.filters` or `trigger_condition.included_filters.filters`.

        '
      properties:
        filter_type:
          type: string
          enum:
          - actions
        action_name:
          type: string
          description: The name of the action/event to filter on.
        execution:
          type: object
          properties:
            type:
              type: string
              enum:
              - atleast
              - atmost
              - exactly
            count:
              type: integer
        executed:
          type: boolean
          description: Whether the action was executed.
        attributes:
          $ref: '#/components/schemas/FilterGroup'
        condition:
          type: string
          description: The condition type. Must be passed as the string "IF".
    VariationDetails:
      type: object
      description: 'Configuration for A/B testing variations.


        For runnable `MANUAL` (fixed split) and `SHERPA` (auto-optimized) examples, refer to [A/B test variations](/api/campaigns/campaign-content-reference#a-b-test-variations).

        '
      properties:
        distribution_type:
          type: string
          enum:
          - SHERPA
          - MANUAL
          description: 'The traffic distribution method for A/B test variations.


            - `MANUAL` - you specify a fixed percentage split across variations.

            - `SHERPA` - MoEngage''s AI-powered optimizer automatically shifts traffic toward the best-performing variation during the campaign run.

            '
        no_of_variations:
          type: integer
          minimum: 1
          description: The number of A/B test variations.
          example: 2
        manual_distribution_percentage:
          type: object
          additionalProperties:
            type: integer
          description: "Fixed percentage of audience assigned to each variation. \n**Note:** Variation keys must follow the `variation_N` naming format (e.g. `variation_1`, `variation_2`). Keys with any other format like `var_1`, `1`, `2` will be rejected with a validation error.\n\n**Required** when `distribution_type` is `MANUAL`.\n"
          example:
            variation_1: 50
            variation_2: 50
        sherpa_campaign_duration:
          type: integer
          description: 'Duration in hours over which MoEngage Sherpa collects performance data before declaring a winning variation.


            **Required** when `distribution_type` is `SHERPA`.

            '
        sherpa_distribution_metric:
          type: string
          enum:
          - OPEN_RATE
          - CLICK_RATE
          - BOTH
          description: 'The engagement metric Sherpa uses to evaluate and rank variations.


            **Required** when `distribution_type` is `SHERPA`.

            '
    PushCampaignContent:
      type: object
      description: 'Push message content, locales, and A/B variations.


        For full `POST /v5/campaigns` request examples that include `campaign_content`, refer to `campaign_delivery_type` on `PushCampaignCreateV5Request`, `VariationDetails`, and the Create Campaign Draft code samples.


        For per-template-type runnable payloads, refer to [Android push content](/api/campaigns/campaign-content-reference#android-push-content), [iOS push content](/api/campaigns/campaign-content-reference#ios-push-content), or [Web push content](/api/campaigns/campaign-content-reference#web-push-content).

        '
      properties:
        locales:
          type: array
          items:
            type: string
          description: 'Additional locale names for multi-language campaigns. List only the non-default locales here (for example, `"en-US"`, `"es-ES"`). The `"default"` locale is always implicitly present and must not be included in this array.

            '
          example:
          - en-US
          - es-ES
        variation_details:
          $ref: '#/components/schemas/VariationDetails'
        content:
          type: object
          description: 'The campaign message payload. Two shapes are accepted:


            - **Flat shape (no locales or variations):** Pass a flat `push` object directly under `content`.

            - **Locale-keyed and variation-keyed shape:** Key by locale name, then by variation name: `content[locale_name][variation_name] = { push: { ... } }`. The `"default"` locale key is always required and serves as the fallback. Additional locale keys must match values listed in `locales`.

            <Warning>

            If your V1 integration used locale-variation wrapping, you must continue using that structure in V5. The flat format is only valid when no locales or A/B variations are configured on the campaign.

            </Warning>


            For runnable payloads for both shapes, refer to [Content payload structure](/api/campaigns/campaign-content-reference#content-payload-structure).

            '
          properties:
            push:
              $ref: '#/components/schemas/PushContent'
          additionalProperties:
            type: object
            description: Variation-keyed content blocks for a single locale.
            additionalProperties:
              type: object
              properties:
                push:
                  $ref: '#/components/schemas/PushContent'
    PlatformSpecificDetails:
      type: object
      description: 'Platform-specific configuration details for Push.


        For runnable Android and iOS examples and the mutual-exclusion rule on iOS audience flags, refer to [Platform-specific delivery flags](/api/campaigns/campaign-content-reference#platform-specific-delivery-flags).

        '
      properties:
        android:
          type: object
          properties:
            push_amp_plus_enabled:
              type: boolean
              default: false
              description: Whether Push Amp+ feature is enabled for this campaign.
        ios:
          type: object
          description: '**Note:** You must pass one of these keys as true for iOS.

            '
          properties:
            send_to_all_eligible_device:
              type: boolean
              description: Whether to send the campaign to all eligible devices.
            exclude_provisional_push_devices:
              type: boolean
              description: Whether to exclude provisional push devices.
            send_to_only_provisional_push_enabled_devices:
              type: boolean
              description: Whether to send only to provisional push-enabled devices.
    AndroidBasicDetails:
      type: object
      description: "Basic details for the Android push notification. \n\nFields vary by template_type. All templates support common fields like title, message, default_click_action.\n"
      properties:
        notification_channel:
          type: string
          description: The Android notification channel where the push will be sent.
          example: general
        include_app_name_and_time:
          type: boolean
          description: 'Whether to include the application''s name and timestamp within the banner image.


            **Supported Templates:** Image Banner with Text

            '
        background_color_code:
          type: string
          description: 'The hex code for the notification''s background color.


            **Supported Templates:** Stylized Basic, Simple Image Carousel, Image Banner with Text

            '
          example: '#9a4444'
        app_name_color_code:
          type: string
          description: 'The hex code for the color of the application''s name text.


            **Supported Templates:** Stylized Basic, Simple Image Carousel, Image Banner with Text

            '
          example: '#dea1a1'
        notification_control_color:
          type: string
          enum:
          - LIGHT
          - DARK
          description: 'The color scheme for the notification''s control elements (action buttons).


            **Supported Templates:** Stylized Basic, Simple Image Carousel, Image Banner with Text

            '
        include_title_and_message:
          type: boolean
          description: 'Whether to include the notification''s title and message text within the banner image.


            **Supported Templates:** Image Banner with Text

            '
        apply_background_color_in_text_editor:
          type: boolean
          description: 'Whether to apply the specified background color within the rich text editor for preview.


            **Supported Templates:** Stylized Basic, Simple Image Carousel, Image Banner with Text

            '
        title:
          type: string
          description: The main title of the push notification.
          example: Limited Time Offer!
        message:
          type: string
          description: 'The message body of the push notification.


            You can use HTML in the message parameter to apply rich text formatting, including text color and styles.

            '
          example: Get 50% off on all items. Shop now!
        summary:
          type: string
          description: The summary text for the notification.
        image_url:
          type: string
          format: uri
          description: The image URL for the push notification.
          example: https://example.com/images/promo.jpg
        image_scaling:
          type: string
          enum:
          - FIT_INSIDE_IMAGE_CONTAINER
          - FILL_IMAGE_CONTAINER
          description: 'The scaling behavior for images within the carousel template.


            **Supported Templates:** Simple Image Carousel, Image Banner with Text

            '
        banner_image_url:
          type: string
          format: uri
          description: 'The URL for the background image used in the Image Banner Text template.


            **Required for:** Image Banner with Text template

            '
        input_gif_url:
          type: string
          format: uri
          description: 'The URL for the GIF media used in the push campaign content.


            **Supported Templates:** Basic

            '
        collapsed_push_notification:
          type: string
          description: 'The configuration for the notification''s collapsed state (view before user expands it).


            **Supported Templates:** Image Banner with Text

            '
          example: SAME_AS_TEMPLATE_BACKUP
        carousel_content:
          $ref: '#/components/schemas/CarouselContent'
        default_click_action:
          type: string
          enum:
          - DEEPLINKING
          - NAVIGATE_TO_A_SCREEN
          - RICH_LANDING
          description: The action performed when the main body of the notification is clicked.
        default_click_action_value:
          type: string
          description: The URL or deep link to open when the notification is clicked.
          example: https://example.com/sale
        key_value_pairs:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
          description: Custom key-value pairs for the notification payload.
    EmailDeliveryControls:
      type: object
      description: 'Controls for Email campaign delivery behavior.


        For runnable examples, refer to [Email delivery controls](/api/campaigns/audience-scheduling-delivery-reference#email-delivery-controls).

        '
      properties:
        bypass_dnd:
          type: boolean
          description: Whether to bypass Do Not Disturb settings.
        campaign_throttle_rpm:
          type: integer
          description: The campaign throttle in requests per minute.
          example: 2000
        count_for_frequency_capping:
          type: boolean
          description: Whether to count this campaign for frequency capping.
        ignore_frequency_capping:
          type: boolean
          description: Whether to ignore frequency capping for this campaign.
        minimum_delay_between_two_notification_in_hour:
          type: integer
          description: Minimum delay between two notifications in hours.
    CampaignSearchFieldsV5:
      type: object
      description: 'Filter criteria for searching campaigns.


        The following filter field names changed from V1 to V5:

        - `id` (V1, string) is `ids` in V5 (array of strings). Pass a single-element array to replicate V1 single-ID filtering.

        - `delivery_type` (V1) is `campaign_delivery_type` in V5.


        All other V1 filter fields (`channels`, `created_by`, `created_date`, `name`, `status`, `tags`) use the same names in V5.

        '
      properties:
        ids:
          type: array
          items:
            type: string
          description: 'Filter by one or more campaign IDs.


            In V1, this field was `id` (a single string). In V5, it is `ids` (an array). For single-campaign retrieval, `GET /v5/campaigns/{campaign_id}` is the preferred endpoint.

            '
          example:
          - 64a1b2c3d4e5f6a7b8c9d0e1
        channels:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - PUSH
          description: Include campaigns for any of these channels.
          example:
          - PUSH
          - EMAIL
        created_by:
          type: array
          items:
            type: string
            format: email
          description: Include campaigns created by any of these users (email addresses).
          example:
          - marketer@example.com
        created_date:
          type: object
          description: Filter campaigns by creation date range.
          properties:
            from_date:
              type: string
              format: date-time
              description: Start of the creation date range (ISO 8601 format).
              example: '2024-01-01T00:00:00'
            to_date:
              type: string
              format: date-time
              description: End of the creation date range (ISO 8601 format).
              example: '2024-12-31T23:59:59'
        campaign_delivery_type:
          type: array
          items:
            type: string
            enum:
            - ONE_TIME
            - PERIODIC
            - EVENT_TRIGGERED
            - BUSINESS_EVENT_TRIGGERED
            - DEVICE_TRIGGERED
            - LOCATION_TRIGGERED
          description: 'Include campaigns with any of these delivery types.


            In V1, this field was `delivery_type`. In V5, it is `campaign_delivery_type`.

            '
          example:
          - ONE_TIME
          - PERIODIC
        name:
          type: string
          description: Filter campaigns by name. Partial matches are supported.
          example: Summer Sale
        status:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - ACTIVE
            - SCHEDULED
            - PAUSED
            - SENT
            - SENDING
            - STOPPED
            - ARCHIVED
          description: 'Include campaigns in any of these statuses.


            Drafts are only returned when `DRAFT` is explicitly included here.

            '
        tags:
          type: array
          items:
            type: string
          description: Include campaigns that have any of these tags.
          example:
          - promotional
          - seasonal
        version_number:
          type: integer
          description: 'Filter by campaign version. Only applies when campaign versioning is enabled for your workspace. Omit to include all versions.

            '
    SchedulingDetails:
      type: object
      description: 'Defines when the campaign should be sent.


        For per-delivery-type runnable payloads (`ASAP`, `AT_FIXED_TIME`, `SEND_IN_BTS`, `SEND_IN_USER_TIMEZONE`, and `PERIODIC` with `periodic_details`), refer to [Campaign delivery schedule](/api/campaigns/audience-scheduling-delivery-reference#campaign-delivery-schedule).

        '
      properties:
        delivery_type:
          type: string
          enum:
          - ASAP
          - AT_FIXED_TIME
          - SEND_IN_BTS
          - SEND_IN_USER_TIMEZONE
          description: 'When to deliver the campaign.

            '
        start_time:
          type: string
          format: date-time
          description: 'The start time for the campaign in ISO 8601 format. Interpreted in the timezone specified by the `timezone` field. If `timezone` is not provided, pass this value in UTC.


            Example: "2024-06-21T12:59:00"

            '
        expiry_time:
          type: string
          format: date-time
          description: 'The expiry time for the campaign in ISO 8601 format. Interpreted in the timezone specified by the `timezone` field. If `timezone` is not provided, pass this value in UTC.

            '
        timezone:
          type: string
          description: 'IANA timezone string for the campaign schedule (for example, `Asia/Kolkata`). Required when `delivery_type` is `AT_FIXED_TIME` or `SEND_IN_BTS`. Optional for `SEND_IN_USER_TIMEZONE`, where each user''s own timezone is used.

            '
          example: Asia/Kolkata
        periodic_details:
          $ref: '#/components/schemas/PeriodicDetails'
        bts_details:
          $ref: '#/components/schemas/BTSDetails'
        user_timezone_details:
          $ref: '#/components/schemas/UserTimezoneDetails'
        geo_fence_timelimit:
          type: object
          description: 'Defines the delivery time window for location-triggered campaigns. When configured, notifications are delivered only within the specified schedule.


            **Applicable for:** `LOCATION_TRIGGERED` campaigns.

            '
          properties:
            notification_schedule:
              type: string
              enum:
              - ALWAYS
              - LIMITED_TIME
              description: Controls when delivery is permitted. Set to `ALWAYS` to allow delivery at any time, or `LIMITED_TIME` to restrict delivery to the configured time bounds.
            timebounds:
              type: array
              description: 'One or more start and end time windows within which delivery is permitted.


                **Required** when `notification_schedule` is `LIMITED_TIME`.

                '
              items:
                type: object
                properties:
                  start_time:
                    type: string
                    format: date-time
                    description: Start of the delivery window in ISO 8601 format.
                    example: '2027-06-19T11:02:00'
                  end_time:
                    type: string
                    format: date-time
                    description: End of the delivery window in ISO 8601 format.
                    example: '2029-06-20T13:55:00'
    EmailContent:
      type: object
      description: Email campaign content.
      properties:
        subject:
          type: string
          description: The subject line of the email.
          example: Exclusive Summer Sale - 50% Off!
        preview_text:
          type: string
          description: The preview text shown in email clients.
          example: Don't miss out on our biggest sale of the season
        sender_name:
          type: string
          description: The name of the sender that appears in the email.
          example: MoEngage Team
        from_address:
          type: string
          format: email
          description: The sender's email address.
          example: noreply@example.com
        reply_to_address:
          type: string
          format: email
          description: The reply-to email address.
          example: support@example.com
        cc_ids:
          type: array
          items:
            type: string
            format: email
          description: Email addresses to CC. For runnable examples, refer to [Email content variants](/api/campaigns/campaign-content-reference#email-content-variants).
        bcc_ids:
          type: array
          items:
            type: string
            format: email
          description: Email addresses to BCC. For runnable examples, refer to [Email content variants](/api/campaigns/campaign-content-reference#email-content-variants).
        html_content:
          type: string
          description: 'The HTML content of the email.


            **Optional** if custom_template_id is provided.

            '
          example: <!DOCTYPE html><html><head></head><body><p>Hello {{UserAttribute['First Name']}}</p></body></html>
        email_editor:
          type: string
          enum:
          - Froala Editor
          - Ace Editor
          description: 'The HTML editor used for the email campaign.


            - **Required** if you want to create the campaign using the `Ace Editor`.

            - **Optional** if you want to use the default `Froala Editor`.

            '
          example: Ace Editor
        custom_template_id:
          type: string
          description: 'The ID of a custom email template.


            **Optional** if html_content is provided.


            When this field is provided, the following fields are not required:

            - subject

            - preview_text

            - sender_name

            '
        custom_template_version:
          type: integer
          description: The version of the custom template.
        attachments:
          type: array
          items:
            type: object
            properties:
              file_type:
                type: string
                enum:
                - URL
                - PERSONALIZED_ATTACHMENT
              url:
                type: string
          description: 'Attachments to include in the email.

            '
    CampaignDetailsResponse:
      type: object
      description: 'Detailed information about a campaign returned by GET `/v5/campaigns/{campaign_id}` and

        POST `/v5/campaigns/search`.


        **Identifier change from V1 to V5:**

        - In V1, the campaign identifier was returned as `campaign_id`. In V5, it is returned as `id`.

        - The legacy `campaign_id` field may also be present alongside `id` for backward compatibility, but `id` is the canonical V5 identifier.


        **V1 fields preserved in V5 under the same names:** `created_by`, `updated_by`, `created_at`, `updated_at`, `sent_time`, `flow_id`, `flow_name`, `parent_id`, `connector`, `utm_params`, `campaign_audience_limit`.

        '
      properties:
        id:
          type: string
          description: 'The unique document identifier for this campaign revision.


            In V1, this field was `campaign_id`. In V5, it is `id`.

            '
          example: 64a1b2c3d4e5f6a7b8c9d0e1
        campaign_id:
          type: string
          description: 'The canonical campaign identifier shared across all versions of the campaign when

            campaign versioning is enabled. In non-versioned workspaces, `campaign_id` equals `id`.

            '
          example: camp_abc123xyz
        version_number:
          type: integer
          description: 'Monotonic version index for this campaign document when campaign versioning is enabled. Publishing edits to a previously published campaign creates a new document with a higher `version_number`. `campaign_id` is the canonical identifier shared across versions; `id` is unique per document.

            '
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SCHEDULED
          - PAUSED
          - SENT
          - SENDING
          - STOPPED
          - ARCHIVED
          description: The current status of the campaign.
        channel:
          type: string
          enum:
          - PUSH
          - EMAIL
          - SMS
          description: The communication channel.
        campaign_delivery_type:
          type: string
          enum:
          - ONE_TIME
          - PERIODIC
          - EVENT_TRIGGERED
          - BUSINESS_EVENT_TRIGGERED
          - DEVICE_TRIGGERED
          - LOCATION_TRIGGERED
          - BROADCAST_LIVE_ACTIVITY
          description: The delivery type of the campaign.
        created_by:
          type: string
          format: email
          description: The email ID of the user who created the campaign.
        updated_by:
          type: string
          format: email
          description: The email ID of the user who last updated the campaign.
        created_at:
          type: string
          description: The timestamp when the campaign was created, in UTC.
          example: '2024-07-04 08:00:54.847000'
        updated_at:
          type: string
          description: The timestamp when the campaign was last updated, in UTC.
        sent_time:
          type: string
          description: The timestamp when the campaign was sent, in UTC.
          example: '2024-07-04 20:32:00'
        flow_id:
          type: string
          description: 'The flow ID (only for flow campaigns).


            Only applicable when `include_child_campaigns` is true.

            '
        flow_name:
          type: string
          description: 'The flow name (only for flow campaigns).


            Only applicable when `include_child_campaigns` is true.

            '
        parent_id:
          type: string
          description: 'The campaign ID of the parent campaign.


            Only applicable for periodic child campaigns when `include_child_campaigns` is true.

            '
        basic_details:
          description: 'Basic campaign settings - name, tags, team, platform targets, and channel-specific

            identifiers. Structure varies by channel:

            - **Push:** See `PushBasicDetailsV5` schema (name, platforms, tags, team, geofences, etc.)

            - **Email:** See `EmailBasicDetailsV5` schema (name, content_type, subscription_category, user_attribute_identifier, etc.)

            - **SMS:** connector, sender name, and similar fields.

            '
          oneOf:
          - $ref: '#/components/schemas/PushBasicDetailsV5'
          - $ref: '#/components/schemas/EmailBasicDetailsV5'
        campaign_content:
          description: 'The full campaign content payload including locales and A/B test variations.

            Structure varies by channel:

            - **Push:** See `PushCampaignContent` schema.

            - **Email:** See `EmailCampaignContent` schema.

            '
          oneOf:
          - $ref: '#/components/schemas/PushCampaignContent'
          - $ref: '#/components/schemas/EmailCampaignContent'
        trigger_condition:
          description: 'Trigger condition for event-triggered campaigns. Structure varies by channel:

            - **Push:** See `PushTriggerCondition` schema (supports INTELLIGENT_DELAY).

            - **Email:** See `EmailTriggerCondition` schema.

            '
          oneOf:
          - $ref: '#/components/schemas/PushTriggerCondition'
          - $ref: '#/components/schemas/EmailTriggerCondition'
        segmentation_details:
          $ref: '#/components/schemas/SegmentationDetails'
        scheduling_details:
          description: 'Scheduling configuration as resolved on the campaign. The response is a normalized, read-only view and can include fields that are not part of the `SchedulingDetails` request schema:

            - `delivery_type` may be returned as `SCHEDULED` (a resolved response value, not one of the request enum values).

            - `schedule_time` holds the resolved send time and corresponds to the request-side `start_time`.

            - `time_zone` holds the resolved IANA time zone the schedule is interpreted in.


            Treat these as response-only fields. Use the `SchedulingDetails` request schema when constructing create or update payloads.

            '
          allOf:
          - $ref: '#/components/schemas/SchedulingDetails'
        delivery_controls:
          description: 'Delivery control settings. Structure varies by channel:

            - **Push:** See `PushDeliveryControls` schema (bypass_dnd, campaign_throttle_rpm, ignore_frequency_capping, etc.)

            - **Email:** See `EmailDeliveryControls` schema.

            '
          oneOf:
          - $ref: '#/components/schemas/PushDeliveryControls'
          - $ref: '#/components/schemas/EmailDeliveryControls'
        advanced:
          description: Advanced campaign settings (for Push campaigns). See the `AdvancedDetails` schema for child properties such as `expiration_settings` and `platform_level_priority`.
          allOf:
          - $ref: '#/components/schemas/AdvancedDetails'
        conversion_goal_details:
          $ref: '#/components/schemas/ConversionGoalDetails'
        control_group_details:
          $ref: '#/components/schemas/ControlGroupDetails'
        utm_params:
          $ref: '#/components/schemas/UTMParams'
        connector:
          type: object
          description: 'Connector configuration (for Email and SMS campaigns).

            '
          properties:
            connector_type:
              type: string
              example: SENDGRID
            connector_name:
              type: string
              example: default
        sender_name:
          type: string
          description: 'The sender name configured for the campaign.


            Only applicable for SMS campaigns.

            '
        campaign_audience_limit:
          $ref: '#/components/schemas/CampaignAudienceLimit'
    FilterGroup:
      type: object
      description: 'A group of filters combined with a logical operator.


        For detailed segmentation payload and supported fields, refer to [Create Custom Segment](https://developers.moengage.com/hc/en-us/articles/13277936457748).

        '
      properties:
        filter_operator:
          type: string
          enum:
          - and
          - or
          description: The logical operator to combine filters.
        filters:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/UserAttributeFilter'
            - $ref: '#/components/schemas/ActionFilter'
            - $ref: '#/components/schemas/CustomSegmentFilter'
          description: 'The list of filters to be combined using the filter operator.


            Supported filter types:

            - User attributes-based filters

            - Action-based filters (with or without attributes)

            - Custom segments

            '
    PushContent:
      type: object
      description: Push notification content for Android, iOS, and Web platforms.
      properties:
        android:
          $ref: '#/components/schemas/AndroidPushContent'
        ios:
          $ref: '#/components/schemas/IOSPushContent'
        web:
          $ref: '#/components/schemas/WebPushContent'
    AndroidAdvanced:
      type: object
      description: Platform-level advanced settings for push delivery - TTL, priority, badge count, and similar controls.
      properties:
        coupon_code:
          type: string
          description: The coupon code to be included in the push payload.
          example: SUMMER50
        icon_type_in_notification:
          type: string
          description: The icon type to be included in the push payload.
          example: app_icon
        use_large_icon:
          type: boolean
          description: Whether to use a large icon in the notification.
        make_notification_sticky:
          type: boolean
          description: 'When enabled, the user cannot swipe away the notification.

            '
        dismiss_button_text:
          type: string
          description: 'The text to display on the dismiss button.


            **Required** when make_notification_sticky is true or auto_dismiss_notification is true.

            '
        auto_dismiss_notification:
          type: boolean
          description: Whether the notification can be auto-dismissed.
        auto_dismiss_notification_time_value:
          type: integer
          description: 'The time value after which to auto-dismiss the notification.


            **Required** when auto_dismiss_notification is true.

            '
        auto_dismiss_notification_time_granularity:
          type: string
          enum:
          - DAYS
          - HOURS
          - MINUTES
          description: 'The time unit for auto-dismiss.


            **Required** when auto_dismiss_notification is true.

            '
        group_key:
          type: string
          description: 'The group key used to identify and categorize related push notifications.


            **Note:**

            - Use the same group key for all push notifications you want to group

            - MoEngage automatically modifies the group key to ensure it doesn''t exceed 45 characters

            - Non-Latin scripts, special characters, and spaces are removed

            '
        collapse_replace_key:
          type: string
          description: 'The update key used to identify and update related push notifications.


            Ensure you use the same update key for all push notifications intended to update each other.

            '
    IOSCarouselContent:
      type: object
      description: 'Configuration for image carousel in Simple Image Carousel template.


        **Required for:** Simple Image Carousel template

        '
      properties:
        slider_transition:
          type: string
          enum:
          - MANUAL
          - AUTOMATIC
          description: 'The transition type for the carousel slides.


            In earlier versions of this API, the accepted values were `manual` and `automatic` (lowercase). They are now `MANUAL` and `AUTOMATIC` (uppercase). Update any existing integrations that pass lowercase values.

            '
        slide_data:
          type: array
          description: Array of slide configurations.
          items:
            type: object
            properties:
              image_url:
                type: string
                format: uri
                description: The image URL for this slide.
              image_click_action:
                type: string
                enum:
                - DEEPLINKING
                - RICH_LANDING
                - NAVIGATE_TO_A_SCREEN
                description: The click action for this slide's image.
              image_click_action_value:
                type: string
                description: The click action value for this slide's image.
              key_value_pairs:
                type: array
                items:
                  $ref: '#/components/schemas/KeyValuePair'
    WebButton:
      type: object
      description: Action button configuration for Web push notifications.
      properties:
        title:
          type: string
          description: The text displayed on the button.
          example: View Offer
        icon_url:
          type: string
          format: uri
          description: The URL of an icon to be displayed next to the button text.
        url:
          type: string
          format: uri
          description: The destination URL that the user is redirected to when they click this button.
    UserTimezoneDetails:
      type: object
      description: 'Configuration for sending in the user''s timezone.


        For the field schema and required-when-`SEND_IN_USER_TIMEZONE` rule, refer to [User timezone](/api/campaigns/audience-scheduling-delivery-reference#user-timezone).

        '
      properties:
        send_in_user_timezone:
          type: boolean
          description: Whether to send the campaign on a specific date and time within the user's timezone.
        send_if_user_timezone_has_passed:
          type: boolean
          description: Whether to send the campaign if the user's timezone has passed.
    MetaV5Request:
      type: object
      required:
      - limit
      - page
      properties:
        request_id:
          type: string
          description: A unique identifier for this metadata retrieval request.
          example: '{{request_id}}'
        campaign_fields:
          $ref: '#/components/schemas/CampaignMetaSearchFieldsV5'
        include_child_campaigns:
          type: boolean
          default: false
          description: 'When `true`, returns child campaign metadata for periodic campaigns.


            Activates the following response fields on each campaign object:

            - `total_child_campaigns` - number of child campaigns (present on the parent campaign).

            - `parent_campaign_id` - the parent campaign''s ID (present on each child campaign).


            Defaults to `false`.

            '
        limit:
          type: integer
          description: 'The number of campaigns to display per page.


            **Maximum:** 15. The response does not include a `total_count` field - to determine the total number of results, keep paginating until a response returns fewer items than `limit`.

            '
          minimum: 1
          maximum: 15
          example: 15
        page:
          type: integer
          description: 'The page number to retrieve.


            For example, if there are 200 campaigns and the limit is 10, there will be 20 pages.

            '
          minimum: 1
          example: 1
    CampaignMetaSearchFieldsV5:
      type: object
      description: Filter criteria for retrieving campaign metadata.
      properties:
        id:
          type: string
          description: 'The unique identifier of the campaign to retrieve.

            '
          example: '{{campaign_id}}'
        channels:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - PUSH
            - SMS
            - WHATSAPP
            - FACEBOOK
            - GOOGLE ADS
            - CONNECTORS
          description: 'Include campaigns for any of these channels.

            '
          example:
          - PUSH
          - EMAIL
        created_by:
          type: array
          items:
            type: string
            format: email
          description: Include campaigns created by any of these users (email addresses).
          example:
          - user@example.com
        created_date:
          type: object
          description: Filter campaigns by creation date range.
          properties:
            from_date:
              type: string
              format: date-time
              description: Start of the creation date range (ISO 8601 format).
              example: '2024-01-01T00:00:00'
            to_date:
              type: string
              format: date-time
              description: End of the creation date range (ISO 8601 format).
              example: '2024-12-31T23:59:59'
        delivery_type:
          type: string
          enum:
          - ONE_TIME
          - PERIODIC
          - EVENT_TRIGGERED
          - BUSINESS_EVENT_TRIGGERED
          - DEVICE_TRIGGERED
          - LOCATION_TRIGGERED
          description: 'Filter campaigns by delivery type.

            '
        name:
          type: string
          description: Filter campaigns by name. Partial matches are supported.
          example: Summer Sale
        status:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - SCHEDULED
            - ACTIVE
            - PAUSED
            - SENT
            - SENDING
            - STOPPED
            - ARCHIVED
          description: Include campaigns in any of these statuses.
        tags:
          type: array
          items:
            type: string
          description: Include campaigns that have any of these tags.
          example:
          - promotional
          - seasonal
    EmailTriggerCondition:
      type: object
      description: 'Trigger condition details for Email event-triggered campaigns.


        **Required** for EVENT_TRIGGERED campaigns.


        For per-delay-type runnable payloads (`ASAP`, `DELAY` with `AFTER`/`BEFORE`), filter primitives, and primary/secondary filter combinations, refer to [Trigger conditions](/api/campaigns/audience-scheduling-delivery-reference#trigger-conditions).

        '
      properties:
        included_filters:
          $ref: '#/components/schemas/FilterGroup'
        secondary_included_filters:
          allOf:
          - $ref: '#/components/schemas/FilterGroup'
          description: Additional filters that must also be satisfied for the Email trigger to fire. For runnable examples, refer to [Primary and secondary trigger filters](/api/campaigns/audience-scheduling-delivery-reference#primary-and-secondary-trigger-filters).
        trigger_delay_type:
          type: string
          enum:
          - DELAY
          - ASAP
          description: 'The type of triggered delay.


            When set to DELAY, the following fields are mandatory:

            - trigger_delay_value

            - trigger_delay_granularity

            - trigger_relation

            '
        trigger_delay_value:
          type: integer
          minimum: 0
          description: The numeric value of the triggered delay.
        trigger_delay_granularity:
          type: string
          enum:
          - MINUTES
          - HOURS
          - DAYS
          description: The time unit for the trigger delay.
        trigger_relation:
          type: string
          enum:
          - BEFORE
          - AFTER
          description: 'The trigger relation with delay.


            **Required** when trigger_delay_type is DELAY.

            '
        trigger_attr:
          type: string
          description: The attribute value of the trigger. Pass the string `"If Action"` for event-triggered campaigns.
    GetChildCampaignsRequest:
      type: object
      description: You can request to retrieve child campaign execution details.
      required:
      - request_id
      - limit
      - page
      properties:
        request_id:
          type: string
          description: A unique identifier for this child campaigns retrieval request.
          example: child_req_12345
        limit:
          type: integer
          description: 'The number of child campaigns to display per page.


            **Maximum:** 15

            '
          minimum: 1
          maximum: 15
          example: 15
        page:
          type: integer
          description: 'The page number to retrieve.


            For example, if there are 100 child campaigns and limit is 10, there will be 10 pages.

            '
          minimum: 1
          example: 1
    CampaignMetaResponse:
      type: object
      description: Campaign metadata including basic information and reachability details.
      properties:
        campaign_id:
          type: string
          description: The unique ID of the campaign.
          example: camp_abc123xyz
        channel:
          type: string
          enum:
          - EMAIL
          - PUSH
          - SMS
          - WHATSAPP
          - FACEBOOK
          - GOOGLE ADS
          - CONNECTORS
          description: The communication channel.
        platform:
          type: array
          items:
            type: string
            enum:
            - ANDROID
            - IOS
            - WEB
          description: The platform types supported for the campaign (applicable for Push).
        created_by:
          type: string
          format: email
          description: The email ID of the user who created the campaign.
        campaign_delivery_type:
          type: string
          enum:
          - ONE_TIME
          - PERIODIC
          - EVENT_TRIGGERED
          - BUSINESS_EVENT_TRIGGERED
          - DEVICE_TRIGGERED
          - LOCATION_TRIGGERED
          - BROADCAST_LIVE_ACTIVITY
          description: The delivery type of the campaign.
        campaign_name:
          type: string
          description: The name of the campaign.
          example: Summer Sale Campaign
        campaign_team:
          type: string
          description: The team name associated with the campaign.
        campaign_tags:
          type: array
          items:
            type: string
          description: Tags associated with the campaign.
        campaign_status:
          type: string
          enum:
          - SCHEDULED
          - ACTIVE
          - PAUSED
          - SENT
          - STOPPED
          - RETIRED
          - ARCHIVED
          description: 'The current status of the campaign.


            `RETIRED` is a terminal status applied automatically to campaigns that have reached their end condition. Retired campaigns cannot be reactivated and are distinct from `STOPPED` (manually halted) and `ARCHIVED` (explicitly archived).

            '
        campaign_start_time:
          type: string
          format: date-time
          description: The start time of the campaign in ISO 8601 format. This value is returned in UTC.
          example: '2024-11-28T12:18:00'
        parent_campaign_id:
          type: string
          description: 'The campaign ID of the parent campaign.


            Only shown if the requested campaign_id belongs to a child campaign and `include_child_campaigns` is true.

            '
        total_child_campaigns:
          type: integer
          description: 'The number of child campaigns.


            Only shown if the campaign_id belongs to a parent campaign. Only applicable for periodic campaigns.

            '
        reachability_details:
          type: object
          description: 'Reachability information for the campaign.


            **Important:** Only populated for **scheduled** campaigns (one-time, business event-triggered, and event-triggered).

            Reachability is calculated once daily and cached for 24 hours.

            '
          properties:
            count:
              type: integer
              description: The estimated number of users the scheduled campaign will reach.
              example: 18182
            last_updated_time:
              type: string
              format: date-time
              description: The timestamp when reachability was last calculated, in ISO 8601 format. This value is returned in UTC.
              example: '2024-11-27T09:05:42.661000'
    ConversionGoalDetails_2:
      type: object
      description: Configuration for tracking campaign conversion goals.
      properties:
        attribution_window_in_hours:
          type: integer
          description: The attribution window in hours.
          example: 36
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
          description: List of conversion goals to track.
    PeriodicDetails_2:
      type: object
      description: 'Configuration for periodic campaigns.


        **Required** for PERIODIC campaigns.

        '
      properties:
        sending_frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          description: The frequency to send the campaign.
        repeat_frequency:
          type: integer
          description: The repeat frequency of the campaign.
        no_of_occurences:
          type: integer
          description: The number of occurrences of the campaign.
        repeat_on_date_of_month:
          type: array
          items:
            type: integer
          description: 'The dates of the month on which the campaign should be repeated.


            Example: [5, 25] to send on the 5th and 25th of each month.

            '
        repeat_on_days_of_week:
          type: array
          items:
            type: string
            enum:
            - MONDAY
