              - BAD_REQUEST
              - RATE_LIMITED
              - UNAUTHORIZED
              - INTERNAL_ERROR
              - FORBIDDEN
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  target:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
              description: 'The `request_id` from the originating request. Use this to correlate a failed response back to the specific call that triggered it, particularly useful in high-volume or retry scenarios.


                In V1, `request_id` appeared inside the `error` object. V5 preserves this field in the same location.

                '
    SearchV5Request:
      type: object
      required:
      - limit
      - page
      properties:
        request_id:
          type: string
          description: 'An optional unique identifier for this search request (UUID v4 recommended).


            - In V1, `request_id` was required on every search call. In V5, it is optional.

            - Providing it is recommended for traceability and debugging. MoEngage support can use the value to locate the specific request in server logs.

            '
          example: '{{request_id}}'
        campaign_fields:
          $ref: '#/components/schemas/CampaignSearchFieldsV5'
        include_child_campaigns:
          type: boolean
          default: false
          description: 'When `true`, includes child campaigns in results. Defaults to `false`.


            Child campaign types included:

            - **Periodic children:** Carry `parent_id` in the response.

            - **Flow-node campaigns:** Carry `flow_id` and `flow_name` in the response.

            '
        include_archive_campaigns:
          type: boolean
          default: false
          description: 'When `true`, includes campaigns in `ARCHIVED` status in search results.

            By default, archived campaigns are excluded even if `ARCHIVED` is not in

            `campaign_fields.status`.


            Defaults to `false`.

            '
        limit:
          type: integer
          description: 'The number of campaigns to return per page.


            **Maximum:** 15. The response does not include a `total_count` field - to determine

            the total number of results, keep paginating until a response returns fewer items

            than `limit`.

            '
          minimum: 1
          maximum: 15
          example: 10
        page:
          type: integer
          description: 'The page number to retrieve (1-indexed).


            For example, with 200 campaigns and a limit of 10, there are 20 pages.

            '
          minimum: 1
          example: 1
    WebAdvanced:
      type: object
      description: 'Platform-level advanced settings for push delivery - TTL, priority, badge count, and similar controls.

        '
      properties:
        icon_image_type:
          type: string
          enum:
          - DEFAULT
          - ICON_URL
          description: The type of icon to use for the notification.
        icon_url:
          type: string
          format: uri
          description: The URL for a custom notification icon.
    WebPushContent:
      type: object
      description: Web push notification content.
      properties:
        template_type:
          type: string
          enum:
          - BASIC
          description: The template type for web push (currently only BASIC is supported).
        basic_details:
          $ref: '#/components/schemas/WebBasicDetails'
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/WebButton'
          description: 'Action buttons for the notification.

            '
        advanced:
          $ref: '#/components/schemas/WebAdvanced'
    CarouselContent:
      type: object
      description: 'Configuration for image carousel in Simple Image Carousel template.


        **Required for:** Simple Image Carousel template

        '
      properties:
        slider_transition:
          type: string
          enum:
          - MANUAL
          - AUTOMATIC
          description: 'The transition type for the carousel slides.


            In earlier versions of this API, the accepted values were `manual` and `automatic` (lowercase). They are now `MANUAL` and `AUTOMATIC` (uppercase). Update any existing integrations that pass lowercase values.

            '
        slide_data:
          type: array
          description: Array of slide configurations.
          items:
            type: object
            properties:
              image_url:
                type: string
                format: uri
                description: The image URL for this slide.
              image_click_action:
                type: string
