  /campaigns/{parent_campaign_id}/executions:
    post:
      operationId: get_child_campaigns
      summary: Get Child Campaigns
      description: 'This API retrieves child campaign execution details for Periodic or Business Event-triggered campaigns. Use this API to track execution history of recurring campaigns and monitor the performance of individual instances.

        '
      x-mint:
        content: "<Warning>\n**Not available in V5**\n\nThis endpoint is not yet available in V5. Use this V1 endpoint at `POST /core-services/v1/campaigns/{parent_campaign_id}/executions` until V5 support is added.\n</Warning>\n\n#### Information Retrieved\n- Child campaign IDs\n- Sent time for each execution\n- Status of each child campaign\n- Total number of times the parent campaign has been executed\n\n<Note>\n**Note**\n- Currently, you can use this API to get the child of Periodic and Business Event-triggered Email and Push campaigns.\n- You can only retrieve child campaigns for campaigns created via the [Create Campaign API](https://www.moengage.com/docs/api/create-campaigns/create-campaign).\n- Results are paginated with a maximum of 15 children per page.\n</Note>\n\n#### Rate Limits\n\n| Rate Limit Name | Rate Limit |\n| :--- | :--- |\n| get child campaign per second | The total number of get child campaigns requests per second per client allowed is 10. |\n| get child campaign per minute | The total number of get child campaigns requests per minute per client allowed is 100. |\n| get child campaign per hour | The total number of get child campaigns requests per hour per client allowed is 6000. | \n\n<Note>\n **Notes**\n * Breaching the limits will reject the request.\n * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.\n</Note>\n"
      tags:
      - Get Campaign Details
      parameters:
      - name: parent_campaign_id
        in: path
        required: true
        description: 'The unique ID of the parent campaign (Periodic or Business Event-triggered).


          You can fetch the parent campaign ID using the Search Campaigns API.

          '
        schema:
          type: string
        example: camp_periodic_parent_123
      - $ref: '#/components/parameters/MOE-APPKEY_2'
      requestBody:
        description: Provide pagination parameters for retrieving child campaign executions.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetChildCampaignsRequest'
            examples:
              get_periodic_children:
                summary: Get Periodic Campaign Children
                value:
                  request_id: child_req_12345
                  page: 1
                  limit: 15
              get_business_event_children:
                summary: Get Business Event Children
                value:
                  request_id: child_req_67890
                  page: 1
                  limit: 10
              get_second_page:
                summary: Get Second Page of Children
                value:
                  request_id: child_req_page2
                  page: 2
                  limit: 15
      responses:
        '200':
          description: Successfully retrieved child campaign execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildCampaignsResponse'
              examples:
                periodic_executions:
                  summary: Periodic Campaign Executions
                  value:
                    executions:
                    - campaign_id: camp_child_001
                      sent_time: '2024-06-24T14:30:18.908000'
                      status: Sent
                    - campaign_id: camp_child_002
                      sent_time: '2024-06-24T15:27:45.971000'
                      status: Sent
                    - campaign_id: camp_child_003
                      sent_time: '2024-06-24T15:47:43.528000'
                      status: Sent
                    - campaign_id: camp_child_004
                      sent_time: '2024-06-24T15:54:26.254000'
                      status: Sent
                    - campaign_id: camp_child_005
                      sent_time: '2024-06-24T16:35:01.834000'
                      status: Sending
                    total_instances: 8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
