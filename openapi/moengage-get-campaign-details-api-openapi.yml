  /campaigns/meta:
    post:
      operationId: get_campaign_meta
      summary: Get Campaign Meta (V1 — Legacy)
      description: 'This API retrieves campaign details and reachability information for scheduled campaigns.

        '
      x-mint:
        content: "<Warning>\n**V1 endpoint**\n\nThis page documents the V1 Get Campaign Meta endpoint. The V5 equivalent is available at [Get Campaign Meta (V5)](/api/get-campaign-details/get-campaign-meta). Both V1 and V5 use Basic Auth with a `MOE-APPKEY` header.\n</Warning>\n\n#### Supported Channels\n- EMAIL: Email campaigns\n- PUSH: Push notification campaigns\n- SMS: SMS campaigns\n- WHATSAPP: WhatsApp campaigns\n- FACEBOOK: Facebook campaigns\n- GOOGLE ADS: Google Ads campaigns\n- CONNECTORS: Connector-based campaigns\n\n#### Reachability Information\n- Available only for **scheduled** campaigns (one-time, business event-triggered, and event-triggered).\n- Provides estimated user count that will receive the campaign.\n- Calculated once daily and cached for 24 hours.\n- May vary due to app installations/uninstalls or subscription changes.\n- Reachability is an estimated value and may vary over time. It is calculated once per day and cached for 24 hours. Multiple API calls within the same day will return the cached value.\n\n#### Rate Limits\n\n| Rate Limit Name | Rate Limit |\n| :--- | :--- |\n| get campaign meta per second | The total number of get campaign meta requests per Second per client allowed is 10. |\n| get campaign meta per minute | The total number of get campaign meta requests per minute per client allowed is 100. |\n| get campaign meta per hour | The total number of get campaign meta requests per hour per client allowed is 6000. | \n\n  <Note>\n    **Notes**\n    * Breaching the limits will reject the request.\n    * Per hour and per day limits will consider the calculation based on the last hour and last 24 hrs respectively.\n    </Note>\n"
      tags:
      - Get Campaign Details
      parameters:
      - $ref: '#/components/parameters/MOE-APPKEY_2'
      requestBody:
        description: 'Provide the search criteria for retrieving campaign metadata and reachability information.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignMetaRequest'
            examples:
              meta_by_channel:
                summary: Get Meta by Channel
                value:
                  request_id: meta_req_12345
                  campaign_fields:
                    channels:
                    - EMAIL
                  limit: 15
                  page: 1
              meta_by_campaign_id:
                summary: Get Meta by Campaign ID
                value:
                  request_id: meta_req_67890
                  campaign_fields:
                    id: camp_abc123xyz
                  limit: 1
                  page: 1
              meta_scheduled_with_reachability:
                summary: Get Scheduled Campaign with Reachability
                value:
                  request_id: meta_req_scheduled
                  campaign_fields:
                    channels:
                    - SMS
                    status:
                    - SCHEDULED
                  limit: 10
                  page: 1
              meta_with_child_campaigns:
                summary: Get Meta with Child Campaigns
                value:
                  request_id: meta_req_children
                  campaign_fields:
                    delivery_type:
                    - PERIODIC
                  include_child_campaigns: true
                  limit: 15
                  page: 1
      responses:
        '200':
          description: Successfully retrieved campaign metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignMetaResponse'
              examples:
                email_campaign_meta:
                  summary: Email Campaign Meta
                  value:
                  - campaign_id: camp_email_123
                    channel: EMAIL
                    platform: []
                    created_by: john.doe@example.com
                    campaign_delivery_type: ONE_TIME
                    campaign_name: Weekly Newsletter
                    campaign_team: Marketing
                    campaign_tags:
                    - newsletter
                    - weekly
                    campaign_status: Active
                    campaign_start_time: '2024-11-18T05:50:00'
                sms_scheduled_with_reachability:
                  summary: SMS Scheduled with Reachability
                  value:
                  - campaign_id: camp_sms_456
                    channel: SMS
                    platform: []
                    created_by: admin@example.com
                    campaign_delivery_type: ONE_TIME
                    campaign_name: Promo Code SMS
                    campaign_team: Sales
                    campaign_tags:
                    - promo
                    campaign_status: Scheduled
                    campaign_start_time: '2024-11-28T12:18:00'
                    reachability_details:
                      count: 18182
                      last_updated_time: '2024-11-27T09:05:42.661000'
                push_campaign_meta:
                  summary: Push Campaign Meta
                  value:
                  - campaign_id: camp_push_789
                    channel: PUSH
                    platform:
                    - ANDROID
                    - IOS
                    created_by: jane.smith@example.com
                    campaign_delivery_type: EVENT_TRIGGERED
                    campaign_name: Cart Abandonment
                    campaign_team: Retention
                    campaign_tags:
                    - cart
                    - abandonment
                    campaign_status: Active
                    campaign_start_time: '2024-11-20T10:00:00'
                periodic_with_children:
                  summary: Periodic Campaign with Children
                  value:
                  - campaign_id: camp_periodic_101
                    channel: EMAIL
                    platform: []
                    created_by: marketing@example.com
                    campaign_delivery_type: PERIODIC
                    campaign_name: Monthly Newsletter
                    campaign_team: Content
                    campaign_tags:
                    - newsletter
                    campaign_status: Active
                    campaign_start_time: '2024-01-01T09:00:00'
                    total_child_campaigns: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
