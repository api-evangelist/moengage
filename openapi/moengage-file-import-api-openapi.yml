              examples:
                rate_limit_exceeded:
                  summary: Rate limits exceeded
                  value:
                    status: fail
                    error:
                      message: Rate limits exceeded, please try after some time
                      type: Rate Limits Exceeded
                      request_id: '1234'
components:
  schemas:
    FileRunHistoryResponse:
      type: object
      properties:
        status:
          type: string
          description: This field denotes the status of the API response.
          example: success
        total_count:
          type: integer
          description: This field denotes the total count of the files fetched based on the API request.
          example: 1
        data:
          type: array
          description: This field contains the file data details.
          items:
            type: object
            properties:
              id:
                type: string
                description: This field denotes the unique ID of the file.
              file_name:
                type: string
                description: This field denotes the name of the file.
              scheduled_at:
                type: string
                description: This field denotes the time at which the file is scheduled.
                format: date-time
              completed_at:
                type: string
                description: This field denotes the time at which the file is completed.
                format: date-time
              type:
                type: string
                description: This field denotes the file type.
                enum:
                - USERS
                - EVENTS
                - AUX_DATA
              file_size:
                type: string
                description: This field denotes the file size in terms of the number of rows in the file.
              file_status:
                type: string
                description: This field denotes the file status.
                enum:
                - SUCCESSFUL
                - FAILED
                - PARTIAL_FAILURE
                - QUEUED
              status_msg:
                type: string
                description: This field denotes the error message in case of failure or partial failure.
              total_rows:
                type: integer
                description: This field denotes the total number of rows in the file.
              skipped_rows:
                type: integer
                description: This field denotes the skipped number of rows in the file.
              updated_rows:
                type: integer
                description: This field denotes the updated number of rows in the file.
              failed_rows:
                type: integer
                description: This field denotes the number of rows in the file that failed to process.
              aux_data_added_count:
                type: integer
                description: This field denotes the number of rows added as auxiliary data. This is applicable to auxiliary data.
              aux_data_failed_count:
                type: integer
                description: This field denotes the number of rows that failed to process. This is applicable to auxiliary data.
              added_rows:
                type: integer
                description: This field denotes the total number of rows added from the file.
        offset:
          type: integer
          description: 'This field denotes the pagination value of the imports. For example, if there are 100 imports to be fetched in the response:

            * Offset = 1 will return the first 50 imports

            * Offset = 2 will return the next 50 import details

            '
        more_files:
          type: string
          description: This field indicates if there are more files. For example, if there are 100 imports and offset = 1, 50 imports will be returned with more_file = true to indicate that offset = 2 must be passed to get the next 50 imports.
    ImportDetailsResponse:
      type: object
      properties:
        status:
          type: string
          description: This field denotes the status of the API response.
          example: success
        total_count:
          type: integer
          description: This field denotes the total count of the imports in the response.
          example: 1
        data:
          type: array
          description: This field contains the import data details.
          items:
            type: object
            properties:
              import_id:
                type: string
                description: This field denotes the unique ID of the import.
              import_name:
                type: string
                description: This field denotes the unique name of the import.
              last_run_status:
                type: string
                description: This field denotes the latest sync status of the import.
                format: date-time
              import_type:
                type: string
                description: This field denotes the import type.
                enum:
                - USERS
                - EVENTS
                - AUX_DATA
              schedule_type:
                type: string
                description: This field denotes the file type.
                enum:
                - ONETIME
                - PERIODIC
              import_source:
                type: string
                description: This field denotes the source of import.
                enum:
                - S3
                - SFTP
                - CSV
              custom_segment_config:
                type: array
                description: This field contains details about the custom segment.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: This field denotes the custom segment ID.
                    name:
                      type: string
                      description: This field denotes the unique name of the custom event.
                    type:
                      type: string
                      description: This field denotes the type of custom segment.
                    user_id_column:
                      type: string
                      description: This field denotes the attribute selected as the identifier.
              aux_data_config:
                type: array
                description: This field contains details about the auxiliary data.
                items:
                  type: object
                  properties:
                    primary_key:
                      type: string
                      description: This field denotes the attribute used as the auxiliary data import ID.
                    retention_period:
                      type: integer
                      description: This field denotes the number of days, weeks, and months (to be read with retention_type).
                    retention_type:
                      type: string
                      description: The field denotes retention type.
                      enum:
                      - DAYS
                      - WEEKS
                      - MONTHS
              total_files:
                type: integer
                description: This field denotes the total number of files in the import.
              processed_files:
                type: integer
                description: This field denotes the total number of processed files in the import.
              total_rows:
                type: integer
                description: This field denotes the total number of rows across all files.
              processed_rows:
                type: integer
                description: This field denotes the total number of processed rows across all files.
              created_at:
                type: integer
                description: This field denotes the date at which the import is created.
              last_run_at:
                type: string
                description: This field denotes the date on which the import was last run.
                format: date time
              next_scheduled_at:
                type: string
                description: This field denotes the date on which the import is next scheduled.
                format: date time
              created_by_email:
                type: string
                description: This field denotes the email ID of the team member who created the import.
              status:
                type: string
                description: This field denotes the import status.
              time_zone:
                type: string
                description: This field denotes the timezone of the workspace.
        offset:
          type: integer
          description: 'This field denotes the pagination value of the imports. For example, if there are 100 imports to be fetched in the response:

            * Offset = 1 will return the first 50 imports

            * Offset = 2 will return the next 50 import details

            '
        more_files:
          type: string
          description: This field indicates if there are more files. For example, if there are 100 imports and offset = 1, 50 imports will be returned with more_file = true to indicate that offset = 2 must be passed to get the next 50 imports.
    FileRunHistoryRequest:
      type: object
      required:
      - import_id
      - import_name
      properties:
        import_id:
          type: string
          description: The unique identifier is used to identify the import. You can find this on the Data Imports page of the MoEngage dashboard. Data > Data Imports > Click the ellipsis icon for an import > View. The import_id or the import_name must be passed.
        import_name:
          type: string
          description: This field denotes the name of the import.The import_id or import_name has to be passed. If both are passed, import_id takes precedence.
        date:
          type: object
          description: "This field denotes the file processing date. Supported values are:\n\n* `start_date`\n* `end_date`\n* `format`\n  \nIf this field is not passed, the API will respond with details of all the files corresponding to the import_id / import_name passed and in accordance to the offset and limit values.\n\nSupported date time formats are:\n\n * `\"datetime_format\": \"YYYY-MM-DD\"` (2022-01-22)\n * `\"datetime_format\": \"YYYY/MM/DD\"` (2022/01/22)\n * `\"datetime_format\": \"DD/MM/YYYY\"` (22/01/2022)\n * `\"datetime_format\": \"DD-MM-YYYY\"` (22-01-2022)\n * `\"datetime_format\": \"DD-MM-YYYY hh:mm:ss\"` (31-12-2022 12:10:33)\n * `\"datetime_format\": \"DD/MM/YYYY hh:mm:ss\"` (31/12/2022 12:10:33)\n * `\"datetime_format\": \"YYYY-MM-DD hh:mm:ss\"` (2019-02-22 17:54:14)\n * `\"datetime_format\": \"YYYY/MM/DD hh:mm:ss\"` (2019/02/22 17:54:14)\n"
          properties:
            start_date:
              type: string
              format: date-time
              description: The start date of the import.
            end_date:
              type: string
              format: date-time
              description: The end date of the import.
            format:
              type: string
              description: The format of the date.
        file_status:
          type: array
          description: This field denotes the status of files contained in an import.
          items:
            type: string
            enum:
            - SUCCESSFUL
            - FAILED
            - PARTIAL_SUCCESS
            - PROCESSING
            - QUEUED
            - WAITING
        offset:
          type: integer
          description: "'API responds with a maximum of 50 file details in a single response. For example, if there are a total of 150 files that are part of the API response, then:\n* Offset = 1 will fetch the details of the first 50 files\n* Offset = 2 will fetch the file details of the next 50 imports\n* Offset = 3 will fetch the import details of the last 50 imports\n* If offset is not passed in the request body, the API response will consider offset = 1.\n\nYou can refer to the total_count parameter in the response to understand how many total files are part of the response. \n\nOR\n\n If the API responds with more_files = true, it indicates that there are more files that are not part of the current response for which another API request must be made with offset +1.'\n"
          default: 1
    ImportDetailsRequest:
      type: object
      properties:
        import_type:
          type: string
          enum:
          - USERS
          - EVENTS
          - AUX_DATA
          description: This field denotes the type of data to be imported.
        date:
          type: object
          description: "This field denotes the file processing date. Supported values are:\n\n* `start_date`\n* `end_date`\n* `format`\n  \nIf this field is not passed, the API will respond with details of all the files corresponding to the import_id or import_name passed and in accordance to the offset and limit values.\n\nSupported date time formats are:\n\n * `\"datetime_format\": \"YYYY-MM-DD\"` (2022-01-22)\n * `\"datetime_format\": \"YYYY/MM/DD\"` (2022/01/22)\n * `\"datetime_format\": \"DD/MM/YYYY\"` (22/01/2022)\n * `\"datetime_format\": \"DD-MM-YYYY\"` (22-01-2022)\n * `\"datetime_format\": \"DD-MM-YYYY hh:mm:ss\"` (31-12-2022 12:10:33)\n * `\"datetime_format\": \"DD/MM/YYYY hh:mm:ss\"` (31/12/2022 12:10:33)\n * `\"datetime_format\": \"YYYY-MM-DD hh:mm:ss\"` (2019-02-22 17:54:14)\n * `\"datetime_format\": \"YYYY/MM/DD hh:mm:ss\"` (2019/02/22 17:54:14)\n"
          properties:
            start_date:
              type: string
              format: date-time
              description: The start date of the import.
            end_date:
              type: string
              format: date-time
              description: The end date of the import.
            format:
              type: string
              description: The format of the date.
        schedule_type:
          type: string
          enum:
          - PERIODIC
          - ONETIME
          description: This field denotes the type of import schedule.
        file_source:
          type: string
          enum:
          - SFTP
          - S3
          - CSV
          description: This field denotes the file source of the import.
        schedule_status:
          type: string
          enum:
          - SUCCESSFUL
          - FAILED
          - PARTIAL_SUCCESS
          - SCHEDULED
          - PROCESSING
          - QUEUED
          - ARCHIVED
          description: 'This field denotes the import schedule status.

            * PARTIAL_SUCCESS is displayed when all rows in the files are not processed successfully.

            * QUEUED is displayed when the import is queued to be processed next.

            * ARCHIVED is displayed when the import is archived.

            '
        import_name:
          type: string
          description: This field denotes the name of the import.
        offset:
          type: integer
          description: "'API responds with a maximum of 50 file details in a single response. For example, if there are a total of 150 files that are part of the API response, then:\n* Offset = 1 will fetch the details of the first 50 files\n* Offset = 2 will fetch the file details of the next 50 imports\n* Offset = 3 will fetch the import details of the last 50 imports\n* If offset is not passed in the request body, the API response will consider offset = 1.\n\nYou can refer to the total_count parameter in the response to understand how many total files are part of the response. \n\nOR\n\n If the API responds with more_files = true, it indicates that there are more files that are not part of the current response for which another API request must be made with offset +1.'\n"
          default: 1
  securitySchemes:
    Authentication:
      type: http
      scheme: basic
      description: "Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.\n\n- **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.\n- **Password**: Use your API Key, which you can find within the **Data** tile.\n\n**Note**: After you generate and save the Data API Key, DO NOT generate a new key unless there is a security breach. After you generate a different Data API key and save it, the authentication will start failing. You must update your existing data tracking. \n\nFor more information on authentication and getting your credentials, refer [here](https://www.moengage.com/docs/api/introduction#getting-your-credentials).\n"
