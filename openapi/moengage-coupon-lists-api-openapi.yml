        failure_alert:
          type: boolean
          description: Indicates whether to send an alert on failure.
        coupon_shortage_alert:
          type: object
          description: Configuration for the coupon shortage alert.
          properties:
            alert:
              type: boolean
              description: Indicates whether to enable the coupon shortage alert.
            threshold_count:
              type: integer
              description: The minimum count of coupons remaining to trigger the alert.
        expiry_alert:
          type: object
          description: Configuration for the expiry alert.
          properties:
            alert:
              type: boolean
              description: Indicates whether to enable the expiry alert.
            days_before:
              type: integer
              description: Number of days before expiry to trigger the alert.
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    CreateCouponListRequest:
      type: object
      required:
      - name
      - label
      - expires_at
      - created_by
      properties:
        name:
          type: string
          description: This field consists of the coupon list's unique name.
        label:
          type: string
          description: This field consists of the label name for the coupon list.
        expires_at:
          type: string
          format: date
          description: This field consists of the date the coupon list expires in yyyy-mm-dd format.
        email_alert_subscribers:
          type: array
          items:
            type: string
            format: email
          description: This field consists of the email address of the coupon list subscriber. The subscriber will receive all the alerts on the coupon list in the email provided in this field.
        created_by:
          type: string
