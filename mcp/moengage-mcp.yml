- name: search_campaigns
  category: search-read
  description: Search campaigns across all channels by name, status, ID, channel, delivery type, or date
    range. Status filters ACTIVE, DRAFT, EXPIRED, NOT_SENT, PAUSED, SCHEDULED, SENDING, SENT, STOPPED,
    UNDER_REVIEW, REJECTED.
- name: get_campaign
  category: search-read
  description: Fetch a single campaign's full configuration and content.
- name: get_campaign_meta
  category: search-read
  description: Fetch a single campaign's metadata.
- name: get_campaign_stats
  category: campaign-analytics
  description: Aggregate performance — delivery rate, opens, clicks, CTR, and channel-specific metrics.
