servers:
- name: moengage
  label: MoEngage AI Connector
  transport: http
  url: https://mcp.moengage.com
  auth: oauth2
  auth_note: OAuth-based authentication tied to the user's MoEngage account. The server inherits the environment,
    workspace, and role of the active MoEngage session; all tool calls respect existing MoEngage role-based
    permissions. Dynamic client registration is supported at the authorization server.
