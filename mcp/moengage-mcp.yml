  authorization_servers:
  - https://moeauth.moengage.com
  scopes_supported:
  - openid
  - email
  - profile
  - offline_access
  - campaigns:read
  file: ../well-known/moengage-oauth-protected-resource.json
clients_documented:
- Claude (Desktop and claude.ai, personal and organization connector)
- ChatGPT (Business / Enterprise custom MCP connector)
- GitHub Copilot in VS Code 1.101+ (remote MCP with OAuth)
agent_design_notes:
- discover_schema returns the exact current request shape (required fields, allowed values, worked example)
  for whatever is being built, so the assistant does not have to guess payloads.
- get_content_guide serves on-demand validated authoring guidance for Jinja personalization and email
  HTML.
- The MCP builds and validates drafts only. Publishing a campaign, and starting or stopping a flow, remain
  human actions in the MoEngage dashboard unless a tool explicitly covers them.
- All analytics tools enforce a maximum date range of 30 days.
tools:
- name: discover_schema
  category: campaign-build
  description: Returns the exact request shape for a campaign type, component, template, or modifier —
    required and forbidden fields, a proven minimum example, and the rules for that type. Call before
    building any payload.
- name: create_campaign_draft
  category: campaign-build
  description: Create a campaign draft in one call.
- name: patch_campaign_components
  category: campaign-build
  description: Update one or more components of an existing draft.
- name: validate_campaign_draft
  category: campaign-build
  description: Dry-run the full publish validation against a draft without changing it; returns field-level
    errors.
- name: create_personalization_preview
  category: campaign-build
  description: Render personalization for sample users to spot-check content before creating.
- name: test_campaign_inline
  category: campaign-build
  description: Send a test message from an inline payload to verify content.
- name: test_campaign_by_draft_id
  category: campaign-build
  description: Send a test message for an existing draft to verify it.
- name: update_campaign_status
  category: campaign-build
  description: STOP, PAUSE, or RESUME an already-running campaign (not drafts).
- name: get_content_guide
  category: content-authoring
  description: Validated authoring guidance for content. Request a topic (jinja, email_html, email_deliverability)
    and an optional section.
- name: create_content_block
  category: content-blocks
  description: Create a reusable content block, such as a shared email footer.
- name: edit_content_block
