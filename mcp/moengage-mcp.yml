- name: create_custom_segment
  category: segments
  description: Create a custom segment from event and attribute filters.
- name: list_segments
  category: segments
  description: Browse existing custom segments in the workspace.
- name: get_segment
  category: segments
  description: Read a single segment's definition.
- name: start_segment_count
  category: segments
  description: Kick off an async user count for a segment, including channel-level reachability.
- name: poll_segment_count
  category: segments
  description: Poll for the result of an async segment count.
- name: get_value_suggestions
  category: segments
  description: Get suggested values for an event or user attribute while building a segment.
- name: search_flows
  category: flows
  description: Find flows by name, status, or other criteria.
- name: get_flow
  category: flows
  description: Read a flow's configuration.
- name: get_flow_version
  category: flows
  description: Read a specific version of a flow.
- name: get_flow_analytics
  category: flows
  description: The flow-level health view — how the flow is performing overall.
- name: get_flow_channel_analytics
  category: flows
  description: Channel-scoped analytics for a flow.
- name: update_flow_status
  category: flows
  description: Pause or stop a flow.
- name: list_dashboards
  category: dashboards
