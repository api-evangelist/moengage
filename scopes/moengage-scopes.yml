authorization_model_note: >-
  MoEngage documents that the OAuth consent screen may list only a read scope (for example campaigns:read)
  even though the connector exposes write tools. Actual authorization is enforced by the user's MoEngage
  role-based permissions and by which tools the client has enabled, not by the granted scope string. The
  scopes_supported list is therefore narrower than the tool surface it fronts.
tenancy_claims:
  dc: The MoEngage data center the session belongs to.
  tenant_id: The workspace identifier.
  db_name: The backing datastore for the workspace.
  roles: The user's MoEngage roles, which gate tool execution.
